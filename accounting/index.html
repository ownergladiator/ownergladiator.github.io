<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounting Gladiator</title>
<meta name="description" content="Accounting Gladiator — бухгалтерия трака: стейтменты компании, инвойсы сервиса и расходы. Загрузите PDF — суммы посчитаются сами.">
<meta name="theme-color" content="#0d0f12" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accounting">
<meta name="application-name" content="Accounting Gladiator">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<!--
  Accounting Gladiator: the books of the truck business. A sibling of OwnerGladiator Hub (same Supabase project, same sign-in).
  What it owns: table ag_docs (one row per statement, shop invoice, hand-typed expense or income) and the private storage bucket ag-docs
  (the uploaded PDFs and receipts, one folder per user). It never writes to the Hub's tables.
  What it reads from the Hub: the trip name and the dates of each saved week (weekly_reports.full_payload, user_drafts.draft_json),
  so the totals can be shown per trip (рейс).
  Reading PDFs: vendor/pdf.min.js (pdf.js 6.2, the legacy build, loaded on the first upload) gives the text with positions, AGParse turns it into numbers.
  Known formats: datatruck.io "Truck Owner Settlement" and Tekmetric "Invoice for RO #". Other files are filled in by hand.
-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem('ag_theme')||localStorage.getItem('hs_theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
<style>
:root{--bg:#0d0f12;--bg2:#101318;--card:#15181d;--card2:#1b1f26;--line:#2a2f38;--line2:#22262e;--tx:#f4f4f2;--tx2:#c9ced6;--mut:#9aa1ad;--dim:#6c7480;--acc:#ffc400;--acc2:#e3a300;--ink:#171200;--grn:#3ddc97;--red:#ff5a5f;--red2:#ff8a8d;--blu:#5cc8ff;--vio:#b39cff;--amb:#ffb547;--road:#23272f;--shadow:0 10px 30px rgba(0,0,0,.45);--fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
[data-theme=light]{--bg:#e9ecf0;--bg2:#dde1e7;--card:#ffffff;--card2:#f2f4f7;--line:#cfd5de;--line2:#e4e8ee;--tx:#12171f;--tx2:#2e3845;--mut:#4d5967;--dim:#74808f;--acc:#f2b600;--acc2:#a87800;--ink:#171200;--grn:#0a8f5c;--red:#d92d3a;--red2:#c4323a;--blu:#0b79b8;--vio:#6a54dd;--amb:#9a5a00;--road:#c3c9d3;--shadow:0 10px 30px rgba(20,30,45,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.35;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-decoration:none}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.fd{font-family:var(--fd)}
.mut{color:var(--mut)}.dim{color:var(--dim)}.grn{color:var(--grn)}.red{color:var(--red)}.acc{color:var(--acc)}.blu{color:var(--blu)}
[data-theme=light] .acc{color:var(--acc2)}
.nw{white-space:nowrap}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* boot */
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:50;color:var(--mut);font-size:14px}
.boot svg{width:72px;height:auto}

/* header (phone) */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line2);padding-top:var(--st)}
.hdr .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{width:26px;height:auto;flex:none}
.bn{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1;white-space:nowrap}
.bn b{color:var(--acc);font-weight:800}
[data-theme=light] .bn b{color:var(--acc2)}
.sync{width:10px;height:10px;border-radius:50%;background:var(--grn);border:0;padding:0;flex:none}
.sync.pend{background:var(--amb);animation:pulse 1s ease-in-out infinite}.sync.off{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--tx)}
.ib svg{width:20px;height:20px}

/* page */
main{padding:12px 0 calc(92px + var(--sb))}
.pg{display:flex;flex-direction:column;gap:12px}
.ttl{display:flex;align-items:center;gap:10px;min-height:40px}
.ttl h1{font-family:var(--fd);font-weight:800;font-size:27px;line-height:1;flex:1;min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec h2{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.1}
.sec .lnk{font-size:13px;font-weight:700;color:var(--acc);background:none;border:0;padding:4px 0}
[data-theme=light] .sec .lnk{color:var(--acc2)}
.sub{font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.pad{padding:13px 14px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.who b{color:var(--tx)}
.who .chip{margin-left:auto}

/* trip switcher */
.per{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px}
.per button.nv{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.per button.nv svg{width:20px;height:20px}
.per button.nv:disabled{opacity:.25}
.per .pm{flex:1;text-align:center;border:0;background:none;padding:2px 4px;min-width:0}
.per .pm b{display:block;font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per .pm span{font-size:12px;color:var(--mut)}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:6px;font-family:var(--fb);letter-spacing:0}
.st.active{background:rgba(61,220,151,.14);color:var(--grn)}
.st.done{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.st.future{background:rgba(92,200,255,.14);color:var(--blu)}
.st.auto{background:transparent;color:var(--dim);border:1px dashed var(--line)}
.st.live{background:rgba(92,200,255,.14);color:var(--blu)}

/* hero: the road to the goal */
.hero{position:relative;overflow:hidden;padding:16px 14px 14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 12px;flex-wrap:wrap}
.hero .hl{font-size:12.5px;font-weight:600;color:var(--mut)}
.hero .big{font-family:var(--fd);font-weight:800;font-size:clamp(38px,11.5vw,58px);line-height:.95;margin-top:3px;white-space:nowrap;letter-spacing:.3px}
.hero .big.neg{color:var(--red)}
.hero .of{font-size:13px;color:var(--mut);margin-top:5px}
.hero .of b{color:var(--tx);font-weight:600}
.pctb{text-align:right;flex:none;margin-left:auto}
.pctb b{display:block;font-family:var(--fd);font-weight:800;font-size:clamp(38px,11.5vw,58px);line-height:.95;color:var(--acc)}
[data-theme=light] .pctb b{color:var(--acc2)}
.pctb.hit b{color:var(--grn)}
.pctb span{font-size:12.5px;font-weight:600;color:var(--mut)}
.rw{position:relative;margin-top:14px}
.signs{position:relative;height:30px}
.signs.two{height:54px}
.sign{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);pointer-events:none}
.sign.r{transform:translateX(-100%);align-items:flex-end}.sign.l{transform:none;align-items:flex-start}
.sign b{font-family:var(--fd);font-weight:700;font-size:14px;line-height:1;padding:3px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.sign i{display:block;width:2px;height:9px;background:var(--line)}
.sign.up i{height:33px}
.sign.r i{margin-right:0}.sign.l i{margin-left:0}
.sign.goal b{border-color:var(--acc);color:var(--acc)}
[data-theme=light] .sign.goal b{color:var(--acc2)}
.sign.goal i{background:var(--acc)}
.sign.hit b{background:rgba(61,220,151,.14);border-color:var(--grn);color:var(--grn)}
.sign.hit i{background:var(--grn)}
.road{position:relative;height:34px;border-radius:9px;background:var(--road);overflow:hidden}
.road::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,var(--acc) 0 14px,transparent 14px 28px);opacity:.5}
.road .fill{position:absolute;left:0;top:0;bottom:0;display:flex;gap:2px;min-width:3px}
.road .fill i{display:block;height:100%;background:var(--acc);min-width:1px}
.road .fill i.live{background:repeating-linear-gradient(135deg,var(--blu) 0 6px,color-mix(in srgb,var(--blu) 45%,var(--road)) 6px 12px)}
.road .fill.won i{background:var(--grn)}
.road .fill.won i.live{background:repeating-linear-gradient(135deg,var(--blu) 0 6px,color-mix(in srgb,var(--blu) 45%,var(--road)) 6px 12px)}
.road .gl{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--tx);opacity:.75}
.ticks{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--dim);font-family:var(--fd);font-weight:600}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ticks span.l{transform:none}.ticks span.r{transform:translateX(-100%)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:6px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:12px;height:10px;border-radius:2px;background:var(--acc);flex:none}
.lgd i.live{background:repeating-linear-gradient(135deg,var(--blu) 0 3px,color-mix(in srgb,var(--blu) 45%,var(--road)) 3px 6px)}
.bline{margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.bline b{font-family:var(--fd);font-weight:700;font-size:17px}
.note{font-size:13px;color:var(--tx2);background:var(--card2);border-left:3px solid var(--blu);border-radius:8px;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere}

/* pace */
.pace .pr{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px;min-height:26px}
.pace .pr .v{font-family:var(--fd);font-weight:700;font-size:16px;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar.t i{background:var(--dim)}
.verd{margin-top:8px;font-size:13.5px;font-weight:600}
.facts{display:flex;flex-direction:column;margin-top:8px}
.facts div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line2);font-size:13.5px}
.facts div span{color:var(--mut)}
.facts div b{font-family:var(--fd);font-weight:700;font-size:17px;white-space:nowrap;text-align:right}
.facts div b small{font-family:var(--fb);font-weight:500;font-size:12px;color:var(--mut)}

/* tiles */
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--fd);font-weight:800;font-size:25px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k.hl{border-color:var(--acc)}

/* bars chart */
.wkc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;position:relative}
.wkc .col{display:flex;flex-direction:column;align-items:stretch;gap:3px;background:none;border:0;padding:0;min-width:0;color:var(--tx)}
.wkc .col .v{height:17px;font-family:var(--fd);font-weight:700;font-size:13px;text-align:center;white-space:nowrap}
.wkc .col .plot{position:relative;height:118px}
.wkc .col .plot i{position:absolute;left:50%;width:min(72%,88px);transform:translateX(-50%);border-radius:5px 5px 2px 2px;background:var(--acc);min-height:2px}
.wkc .col .plot i.neg{background:var(--red);border-radius:2px 2px 5px 5px}
.wkc .col .plot i.live{background:repeating-linear-gradient(135deg,var(--blu) 0 6px,color-mix(in srgb,var(--blu) 45%,var(--card)) 6px 12px)}
.wkc .col .plot i.alt{background:var(--acc2)}
.wkc .col .plot i.dimb{background:var(--dim)}
.wkc .col .x{height:15px;font-size:10.5px;color:var(--mut);text-align:center;white-space:nowrap;overflow:hidden}
.wkc .col.sel .x{color:var(--tx);font-weight:700}
.wkc .zero{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
.wkc .tgt{position:absolute;left:0;right:0;border-top:1.5px dashed var(--grn);pointer-events:none}
.wkc .tgt span{position:absolute;right:0;bottom:2px;font-size:10.5px;font-weight:700;color:var(--grn);background:var(--card);padding:0 3px;border-radius:3px}
.wkc .sep{position:absolute;top:17px;bottom:15px;width:1px;border-left:1px dashed var(--line);pointer-events:none}
.scr{overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}

/* dense rows / tables */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 12px;border:0;border-top:1px solid var(--line2);width:100%;background:none;text-align:left;color:var(--tx)}
.row:first-child{border-top:0}
button.row:active{background:var(--card2)}
.row .g{flex:1;min-width:0}
.row .n{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--fd);font-weight:700;font-size:18px;white-space:nowrap;text-align:right}
.row .v small{display:block;font-family:var(--fb);font-weight:500;font-size:11.5px;color:var(--mut)}
.row .chev{width:16px;height:16px;color:var(--dim);flex:none}
.ghd{padding:7px 12px;background:var(--card2);font-size:12px;font-weight:700;color:var(--mut);border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px}
.ghd:first-child{border-top:0}
.tw{overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;font-weight:700;color:var(--mut);text-align:right;padding:8px 10px;background:var(--card2);white-space:nowrap;border-bottom:1px solid var(--line2)}
table.t td{padding:8px 10px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap;font-family:var(--fd);font-weight:600;font-size:16px}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.t th:first-child{background:var(--card2)}
table.t td:first-child{font-family:var(--fb);font-size:13.5px;font-weight:600;max-width:190px;white-space:normal}
table.t td:first-child small{display:block;font-weight:500;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
table.t tr.tap{cursor:pointer}
table.t td.h2{background:rgba(61,220,151,.20)}table.t td.h1{background:rgba(61,220,151,.09)}
table.t td.l1{background:rgba(255,90,95,.09)}table.t td.l2{background:rgba(255,90,95,.20)}
table.t tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
table.t th[data-act]{cursor:pointer}

/* trip cards */
.tc{display:block;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx)}
.tc.cur{border-color:var(--acc)}
.tc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tc .nm{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1}
.tc .dt{font-size:12.5px;color:var(--mut);margin-top:2px}
.tc .nt{font-family:var(--fd);font-weight:800;font-size:27px;line-height:1;text-align:right;white-space:nowrap}
.tc .nt small{display:block;font-family:var(--fb);font-weight:600;font-size:12px;color:var(--mut);margin-top:3px}
.tc .bar{margin-top:10px}
.tc .ms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.tc .ms div{min-width:0}
.tc .ms span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .ms b{font-family:var(--fd);font-weight:700;font-size:16px;white-space:nowrap}
.cmp{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);font-size:13.5px;align-items:stretch}
.cmp>*{padding:8px 8px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap;font-family:var(--fd);font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cmp>.m{text-align:left;font-family:var(--fb);font-weight:500;font-size:12.5px;line-height:1.25;color:var(--tx2);padding-left:14px;white-space:normal;display:flex;align-items:center}
.cmp>.hd{font-family:var(--fb);font-size:11.5px;font-weight:700;color:var(--mut);background:var(--card2);border-top:0}
.cmp>.d{padding-right:14px}

/* money split */
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.stk i{display:block;height:100%;min-width:2px}
.cats{margin-top:8px}
.cats .c{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;align-items:center;gap:10px;min-height:32px;border-top:1px solid var(--line2);font-size:13.5px}
.cats .c:first-child{border-top:0}
.cats .c .nm{display:flex;align-items:center;gap:8px;min-width:0}
.cats .c .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats .c i{width:9px;height:9px;border-radius:3px;flex:none}
.cats .c b{font-family:var(--fd);font-weight:700;font-size:16.5px;white-space:nowrap}
.cats .c em{font-style:normal;font-size:12px;color:var(--mut);text-align:right}

/* loads */
.ld{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-top:1px solid var(--line2)}
.ld:first-child{border-top:0}
.ld .rt{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.ld .rt .ar{color:var(--dim);margin:0 4px}
.ld .rp{font-family:var(--fd);font-weight:800;font-size:19px;text-align:right;white-space:nowrap}
.ld .rp small{font-family:var(--fb);font-weight:500;font-size:11px;color:var(--mut)}
.ld .mt{font-size:12px;color:var(--mut);min-width:0;overflow-wrap:anywhere}
.ld .gr{font-family:var(--fd);font-weight:600;font-size:15px;text-align:right;color:var(--tx2);white-space:nowrap}
.ld .pt{grid-column:1/-1;font-size:12px;color:var(--vio);padding-left:12px;border-left:2px solid var(--vio);margin-top:3px}

<script>
/* Accounting Gladiator — reading documents (no DOM). Works in the browser and in Node tests.
   Input: the text pieces of a PDF with their positions (from pdf.js). Output: a plain object with what the document says.
   Known formats: a carrier settlement made by datatruck.io ("Truck Owner Settlement" + fuel card report)

(function (G) {

var P = {};

    .replace(/[-]/g, function (c) { return LIG[c] || ''; })
    .replace(/ﬀ/g, 'ff').replace(/ﬁ/g, 'fi').replace(/ﬂ/g, 'fl').replace(/ﬃ/g, 'ffi').replace(/ﬄ/g, 'ffl')
    .replace(/[   ]/g, ' ');

function pad(n) { return (n < 10 ? '0' : '') + n; }

/* "$1,234.56", "-$5.00", "$-5.00", "(123.45)" -> number */

  var s = String(v == null ? '' : v).replace(/[−–]/g, '-').trim();

}
var MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
/* 10/26/2026, 10/31/26, 2026-10-31, Oct 31, 2026 -> 2026-10-31 ('' when there is no date) */
function isoDate(s) {
  s = String(s || '');
  var m = s.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})(?!\d)/);
  if (m) {
    var y = +m[3], mo = +m[1], d = +m[2]; if (y < 100) y += 2000;
    return (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) ? y + '-' + pad(mo) + '-' + pad(d) : '';
  }
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/\b([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/);

}
function eq(a, b) { return String(a).trim().toLowerCase() === String(b).trim().toLowerCase(); }
function grab(text, rx) { var m = text.match(rx); return m ? String(m[1]).trim() : ''; }

/* ---------- layout: pieces -> lines -> cells ---------- */
/* items: [{p: page (1..), s: text, x, y (from the top), w}] */
function layout(items) {
  var its = [];
  (items || []).forEach(function (it) {
    var s = clean(it.s);
    if (!s.trim()) return;
    its.push({ p: it.p || 1, s: s, x: +it.x || 0, y: +it.y || 0, w: +it.w || 0 });
  });
  its.sort(function (a, b) { return a.p - b.p || a.y - b.y || a.x - b.x; });
  var lines = [], cur = null;
  its.forEach(function (it) {
    if (!cur || cur.p !== it.p || it.y - cur.y > 2.5) { cur = { p: it.p, y: it.y, Y: it.p * 100000 + it.y, raw: [] }; lines.push(cur); }
    cur.raw.push(it);

    ln.raw.sort(function (a, b) { return a.x - b.x; });
    ln.cells = [];
    var c = null;
    ln.raw.forEach(function (it) {

      if (c && it.x - (c.x + c.w) < 0.8 && Math.abs(it.y - c.y) < 1.5) { c.s += it.s; c.w = it.x + it.w - c.x; }
      else { c = { s: it.s, x: it.x, w: it.w, y: it.y, p: it.p, Y: it.p * 100000 + it.y }; ln.cells.push(c); }
    });
    ln.cells.forEach(function (x) { x.s = x.s.replace(/\s+/g, ' ').trim(); });

}

/* a table header: the line that has a cell named `first` and cells for every name in `need` */
function findHeader(L, first, need, afterY) {
  for (var i = 0; i < L.lines.length; i++) {
    var ln = L.lines[i]; if (afterY && ln.Y <= afterY) continue;
    var k = -1;
    for (var j = 0; j < ln.cells.length; j++) if (eq(ln.cells[j].s, first)) { k = j; break; }
    if (k < 0) continue;
    var ok = (need || []).every(function (n) { return ln.cells.some(function (c) { return eq(c.s, n); }); });
    if (!ok) continue;

function colIndex(hdr, name) { for (var i = 0; i < hdr.cols.length; i++) if (eq(hdr.cols[i].name, name)) return i; return -1; }
/* rows under a header. Every row has one cell in the anchor column that passes anchorOk;
   the other cells (a cell may wrap onto 2-3 short lines) go to the nearest anchor. */
function tableRows(L, hdr, anchor, o) {
  o = o || {};

  if (ai < 0) return { rows: [], stop: null };
  for (var i = 0; i < L.lines.length; i++) {
    var ln = L.lines[i]; if (ln.Y <= hdr.Y + 1) continue;
    if (o.stop && o.stop(ln, cols)) { stopLine = ln; break; }
    ln.cells.forEach(function (c) {
      var ci = -1;
      for (var k = 0; k < cols.length; k++) if (cols[k].x <= c.x + 2) ci = k;
      if (ci < 0 || eq(c.s, cols[ci].name)) return;          /* left of the table, or a repeated header */
      cells.push({ ci: ci, c: c });
    });
  }
  var anchors = cells.filter(function (q) { return q.ci === ai && (!o.anchorOk || o.anchorOk(q.c.s)); });
  var rows = anchors.map(function (a) { return { Y: a.c.Y, parts: [] }; });
  var maxDist = o.maxDist || 13;
  cells.forEach(function (q) {
    var best = -1, bd = 1e9;
    for (var k = 0; k < rows.length; k++) { var d = Math.abs(rows[k].Y - q.c.Y); if (d < bd) { bd = d; best = k; } }
    if (best < 0 || bd > maxDist) return;
    (rows[best].parts[q.ci] = rows[best].parts[q.ci] || []).push(q.c);
  });
  return {
    stop: stopLine,
    rows: rows.map(function (r) {
      var out = {};
      cols.forEach(function (col, ci) {
        var ps = (r.parts[ci] || []).sort(function (a, b) { return a.Y - b.Y || a.x - b.x; });
        out[col.name.toLowerCase()] = ps.map(function (c) { return c.s; }).join(' ').replace(/-\s+(?=\d)/g, '-').trim();
      });
      return out;
    })

}
function isTotalLine(ln, cols) { return ln.cells.length && /^total:?$/i.test(ln.cells[0].s) && Math.abs(ln.cells[0].x - cols[0].x) < 6; }
var DATE_RX = /^\d{1,2}\/\d{1,2}\/(\d{4}|\d{2})\b/;
function isDateCell(s) { return DATE_RX.test(s); }
function isMoneyCell(s) { return /^-?\(?\$?-?[\d,]*\.\d{2}\)?$/.test(String(s).replace(/\s/g, '')); }

/* ---------- carrier settlement (datatruck.io) ---------- */
/* which bucket a deduction goes to: fuel, pct (the carrier's percent of gross), ins, eld, tax, lease, escrow, advance, maint, other */
function dedKey(type, desc) {
  var s = (String(type) + ' ' + String(desc)).toLowerCase(), t = String(type).toLowerCase();
  if (/fuel|def\b/.test(t)) return 'fuel';
  if (/from_gross|\d\s*%/.test(s) && !/fuel/.test(s)) return 'pct';
  if (/insur/.test(s)) return 'ins';
  if (/log\s*book|\beld\b|logbook/.test(s)) return 'eld';
  if (/escrow/.test(s)) return 'escrow';
  if (/lease|rent|truck payment|trailer payment/.test(s)) return 'lease';
  if (/advance|cash/.test(s)) return 'advance';
  if (/repair|maint|service|parts|tire/.test(s)) return 'maint';
  if (/tax|ifta|hut|toll|permit|ucr|irp|plate|registration/.test(s)) return 'tax';

function parseStatement(L) {
  var T = L.text, o = { type: 'statement', warn: [] };
  o.company = grab(T, /MC number:\s*(.+?)\s+Units?:/) || grab(T, /Transaction Report\s*-\s*(.+)/);
  o.vendor = grab(T, /Vendor name:\s*(.+?)\s+ID:/) || grab(T, /Driver Name:\s*(.+?)\s+Settlement/);
  o.billId = grab(T, /\bID:\s*(\S+)/);
  o.unit = grab(T, /Unit Number:\s*(\S+)/) || grab(T, /Units?:\s*(\S+)/);
  o.settlementNo = grab(T, /Settlement Number:\s*(\S+)/);

  o.periodStart = isoDate(grab(T, /Period Start:\s*(\S+)/));
  o.periodEnd = isoDate(grab(T, /Period End:\s*(\S+)/));

  if (hb) o.bill = tableRows(L, hb, 'Total amount', { anchorOk: isMoneyCell, stop: isTotalLine }).rows.map(function (r) {

  var hd = findHeader(L, 'Type', ['Description', 'Total amount'], titleY) || findHeader(L, 'Type', ['Description', 'Total amount']);
  if (hd) o.ded = tableRows(L, hd, 'Total amount', { anchorOk: isMoneyCell, stop: isTotalLine }).rows.map(function (r) {
    var d = { type: r.type || '', desc: r.description || '', qty: num(r.quantity), rate: num(r.rate), total: r2(Math.abs(num(r['total amount']))) };

  var fm = T.match(/Date:\s*(\d{1,2}\/\d{1,2}\/\d{4})\s*-\s*(\d{1,2}\/\d{1,2}\/\d{4})/);
  if (fm) { o.fuel.from = isoDate(fm[1]); o.fuel.to = isoDate(fm[2]); }

        date: isoDate(r.date), time: tm ? tm[1].replace(/\s/g, '') : '', loc: r.location || '', city: r.city || '', state: r.state || '',

/* ---------- shop invoice (Tekmetric) ---------- */
var KIND = { labor: 'labor', parts: 'part', part: 'part', fee: 'fee', fees: 'fee', sublet: 'sublet', sublets: 'sublet', tire: 'tire', tires: 'tire', discount: 'discount', discounts: 'discount' };
var MONEY = '-?\\$\\s?-?[\\d,]*\\.\\d{2}';
var RX_FULL = new RegExp('^(.*?)\\s+(-?\\d+(?:\\.\\d+)?)\\s*(hrs?)?\\s+(' + MONEY + ')\\s+(' + MONEY + ')$', 'i');

var pdfLib = null;
async function getPdf() {
  if (pdfLib) return pdfLib;
  var m = await import('./vendor/pdf.min.js');
  m.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.js', document.baseURI).href;
  pdfLib = m; return m;
}
function isPdf(file) { return /pdf$/i.test(file.type || '') || /\.pdf$/i.test(file.name || ''); }
function dupOf(kind, ref, upTo) {
  if (!ref) return null;
  for (var i = 0; i < D.docs.length; i++) if (D.docs[i].kind === kind && D.docs[i].ref === ref) return D.docs[i].id;
  for (var j = 0; j < upTo; j++) { var x = IMP.items[j]; if (x.r && x.r.type === kind && x.r.ref === ref) return 'batch'; }
  return null;
}
async function importFiles(files) {
  files = Array.prototype.slice.call(files || []).filter(function (f) { return isPdf(f) || /^image\//.test(f.type || '') || /\.(jpe?g|png|webp|heic)$/i.test(f.name || ''); });
  if (!files.length || !S.user) return;
  ED = null;                          /* an open sheet is reused for the upload */
  IMP = { items: files.map(function (f) { return { file: f, name: f.name, status: 'reading', on: true, replace: false, r: null, f: null, err: '' }; }), busy: true, saving: false, msg: '', libErr: false };
  renderImport();
  var lib = null;
  if (files.some(isPdf)) { try { lib = await getPdf(); } catch (e) { lib = null; if (IMP) IMP.libErr = true; } }
  for (var i = 0; i < files.length; i++) {
    if (!IMP) return;                    /* the sheet was closed */
    var it = IMP.items[i], r = null;
    if (lib && isPdf(it.file)) {
      try { r = P.parseItems(await P.itemsFromPdf(lib, new Uint8Array(await it.file.arrayBuffer()))); } catch (e2) { r = null; }
