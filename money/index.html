<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoneyGladiator</title>
<meta name="description" content="MoneyGladiator — личные финансы: траты, бюджет, банковские счета, цели и статистика">
<meta name="theme-color" content="#0d0f12" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="application-name" content="MoneyGladiator">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem('mg_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0f12;--bg2:#101318;--card:#15181d;--card2:#1b1f26;--line:#2a2f38;--line2:#22262e;--tx:#f4f4f2;--tx2:#c9ced6;--mut:#9aa1ad;--dim:#6c7480;--acc:#ffc400;--acc2:#e3a300;--ink:#171200;--grn:#3ddc97;--red:#ff5a5f;--red2:#ff8a8d;--blu:#5cc8ff;--vio:#b39cff;--org:#ff9f45;--pnk:#ff7a7e;--amb:#ffb547;--shadow:0 10px 30px rgba(0,0,0,.45);--fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
[data-theme=light]{--bg:#e9ecf0;--bg2:#dde1e7;--card:#ffffff;--card2:#f2f4f7;--line:#cfd5de;--line2:#e4e8ee;--tx:#12171f;--tx2:#2e3845;--mut:#4d5967;--dim:#74808f;--acc:#f2b600;--acc2:#c99700;--ink:#171200;--grn:#0a8f5c;--red:#d92d3a;--red2:#c4323a;--blu:#0b79b8;--vio:#6a54dd;--org:#c25e00;--pnk:#c4323a;--amb:#9a5a00;--shadow:0 10px 30px rgba(20,30,45,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-decoration:none}
[hidden]{display:none!important}
.fd{font-family:var(--fd)}
.mut{color:var(--mut)}.grn{color:var(--grn)}.red{color:var(--red)}.amb{color:var(--amb)}.acc{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
/* boot */
.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:50;color:var(--mut);font-size:14px}
.boot svg{width:44px;height:64px}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding-top:var(--st)}
.hdr .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{width:19px;height:28px;flex:none}
.bn{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1;white-space:nowrap}
.bn b{color:var(--acc);font-weight:800}
.sync{width:10px;height:10px;border-radius:50%;background:var(--grn);border:0;padding:0;flex:none}
.sync.pend{background:var(--amb)}.sync.off{background:var(--red)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--tx)}
.ib svg{width:20px;height:20px}
.ib:active{transform:scale(.96)}
/* page */
main{padding:12px 0 calc(110px + var(--sb))}
.pg{display:flex;flex-direction:column;gap:10px}
.ttl{display:flex;align-items:center;gap:10px;min-height:44px}
.ttl h1{margin:0;font-family:var(--fd);font-weight:800;font-size:26px;line-height:1;flex:1}
.ttl .sub{font-size:12.5px;color:var(--mut);font-family:var(--fb);font-weight:500;display:block;margin-top:2px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec h2{margin:0;font-family:var(--fd);font-weight:700;font-size:18px}
.sec a,.sec button.lnk{font-size:13px;font-weight:700;color:var(--acc);background:none;border:0;padding:6px 0}
.cap{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
/* period bar */
.per{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px}
.per button.nv{width:44px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.per button.nv:disabled{opacity:.3}
.per .pm{flex:1;text-align:center;border:0;background:none;padding:2px 4px}
.per .pm b{display:block;font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.1}
.per .pm span{font-size:11.5px;color:var(--mut)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:12px 14px}
.hero .big{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;margin-top:4px}
.hero .sub{font-size:12.5px;color:var(--mut);margin-top:4px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.35;background:rgba(255,90,95,.10);border:1px solid rgba(255,90,95,.35)}
.alert b{color:var(--red2)}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--red)}
.alert.ok{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.3)}.alert.ok svg{color:var(--grn)}.alert.ok b{color:var(--grn)}
.alert.inf{background:rgba(255,196,0,.08);border-color:rgba(255,196,0,.3)}.alert.inf svg{color:var(--acc)}.alert.inf b{color:var(--acc)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 7px;display:flex;flex-direction:column;gap:3px;text-align:left}
.tile .tl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tile .tv{font-family:var(--fd);font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.bar.t{height:7px;border-radius:4px}.bar.t i{border-radius:4px}
/* dense rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 6px 4px 12px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--tx)}
.row:first-child{border-top:0}
button.row:active,.row.tap:active{background:var(--card2)}
.row .g{flex:1;min-width:0}
.row .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--fd);font-weight:700;font-size:16.5px;white-space:nowrap}
.row .v.big{font-size:20px}
.row.pr{padding-right:12px}
.row.dn .n{text-decoration:line-through;color:var(--mut)}
.row .dt{width:56px;flex:none}
.row .dt b{display:block;font-family:var(--fd);font-weight:700;font-size:14px;line-height:1.1}
.row .dt span{font-size:10.5px;font-weight:600;color:var(--mut)}
.ico{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:15px}
.foot{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;background:var(--card2);border-top:1px solid var(--line2);width:100%;border-left:0;border-right:0;border-bottom:0;color:var(--tx);text-align:left}
.foot svg{width:16px;height:16px;flex:none}
/* checkbox button */
.ck{width:44px;height:44px;flex:none;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.ck i{width:22px;height:22px;border-radius:7px;border:2px solid #4a515c;display:flex;align-items:center;justify-content:center}
[data-theme=light] .ck i{border-color:#9aa3af}
.ck.on i{border-color:var(--c,var(--blu));background:var(--c,var(--blu))}
.ck svg{width:14px;height:14px;color:#0d0f12;opacity:0}
.ck.on svg{opacity:1}
/* budget table */
.bt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bt .bh,.bt .br{display:grid;grid-template-columns:minmax(0,1fr) 74px 74px 40px;align-items:center;gap:0 4px;padding:0 10px 0 12px}
.bt .bh{min-height:38px;background:var(--card2)}
.bt .bh .k{font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.bt .bh .nm{font-family:var(--fd);font-weight:700;font-size:14.5px;text-align:right}
.bt .br{position:relative;min-height:40px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--tx)}
.bt .br:active{background:var(--card2)}
.bt .br .nmw{display:flex;align-items:center;gap:6px;min-width:0}
.bt .br .nm{font-family:var(--fd);font-weight:600;font-size:15px;text-align:right;color:var(--tx2)}
.bt .br .ft{font-family:var(--fd);font-weight:700;font-size:15px;text-align:right}
.bt .br .pc{font-size:11.5px;font-weight:700;text-align:right}
.bt .br .ln{position:absolute;left:0;bottom:0;height:2px;opacity:.85}
.bt .cks{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid #4a515c;display:flex;align-items:center;justify-content:center;background:transparent;padding:0}
.bt .cks svg{width:12px;height:12px;color:#0d0f12;opacity:0}
.bt .cks.on{border-color:var(--c);background:var(--c)}.bt .cks.on svg{opacity:1}
.bt .add{display:flex;align-items:center;gap:6px;width:100%;min-height:36px;padding:0 12px;border:0;border-top:1px solid var(--line2);background:transparent;font-size:12.5px;font-weight:600;color:var(--mut);text-align:left}
.bt .add svg{width:14px;height:14px}
.tag{display:inline-block;font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--mut);white-space:nowrap;vertical-align:1px}
.ov .r{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px;align-items:center;min-height:26px;font-size:13.5px;border-top:1px solid var(--line2)}
.ov .r:first-child{border-top:0}
.ov .r .s{display:inline-block;width:14px;font-weight:700}
.ov .r .a{text-align:right;font-family:var(--fd);font-weight:700;font-size:15.5px}
.ov .r.tot{border-top:1px solid var(--line);font-weight:700}
/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:2px}
.chips.sc::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;flex:none;color:var(--tx);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#0d0f12}
.chip.dash{border-style:dashed;color:var(--mut);background:transparent}
.chip small{font-size:11px;font-weight:600;opacity:.8}
.seg{display:grid;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:9px;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--mut);padding:0 2px;white-space:nowrap}
.seg button.on{background:var(--c,var(--acc));color:#0d0f12}
/* buttons & inputs */
.btn{height:50px;border-radius:14px;border:0;background:var(--acc);color:var(--ink);font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:.02em;width:100%;padding:0 14px}
.btn:disabled{opacity:.5}
.btn.o{background:rgba(255,196,0,.08);border:1.5px solid var(--acc);color:var(--acc)}
.btn.g{background:var(--card2);border:1px solid var(--line);color:var(--tx);font-family:var(--fb);font-weight:700;font-size:14px;height:44px}
.btn.d{background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.4);color:var(--red);font-family:var(--fb);font-weight:700;font-size:14px;height:44px}
.btn.sm{height:40px;font-size:14px;font-family:var(--fb);font-weight:700;width:auto;border-radius:12px;padding:0 14px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.pill{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--acc);flex:none}
.pill svg{width:16px;height:16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:12px;font-weight:600;color:var(--mut)}
.in{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;font-size:15px;color:var(--tx);min-width:0}
.in:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.in.money{font-family:var(--fd);font-weight:700;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hint{font-size:12px;color:var(--mut);line-height:1.4}
.msg{font-size:13px;min-height:0}.msg.err{color:var(--red)}.msg.ok{color:var(--grn)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:64px;padding:0 6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:600;background:none;border:0;padding:8px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc);font-weight:700}
.nav .fab{justify-self:center;width:58px;height:58px;border-radius:18px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 18px rgba(255,196,0,.3);padding:0}
.nav .fab svg{width:28px;height:28px}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
.sheet .hd{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--card);padding:6px 0 4px;z-index:2}
.sheet .hd h3{margin:0;flex:1;font-family:var(--fd);font-weight:800;font-size:22px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);max-height:88vh}}
/* amount + keypad */
.amt{text-align:center;padding:2px 0}
.amt .v{font-family:var(--fd);font-weight:800;font-size:52px;line-height:1;word-break:break-all}
.amt .h{font-size:13px;color:var(--mut);margin-top:5px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.kp button{height:52px;border-radius:13px;border:1px solid var(--line);background:var(--card2);font-family:var(--fd);font-weight:700;font-size:25px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--tx)}
.kp button:active{background:var(--line)}
.kp svg{width:24px;height:24px}
.sub-lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);z-index:60;background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;max-width:min(92vw,520px)}
.toast button{background:none;border:0;color:var(--acc2);font-weight:800;padding:4px 2px;white-space:nowrap}
[data-theme=light] .toast button{color:#7a5c00}
/* charts */
.chart{display:block;width:100%;height:auto}
.wk{position:relative;display:grid;align-items:end;height:150px;margin-top:6px}
.wk .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.wk .c b{font-family:var(--fd);font-weight:700;font-size:13px;white-space:nowrap}
.wk .c i{width:70%;max-width:46px;border-radius:7px 7px 3px 3px;background:var(--grn);min-height:2px}
.wk .c span{font-size:11px;color:var(--mut);height:16px;white-space:nowrap}
.wk .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--acc);opacity:.7}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line)}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:12.5px}
.lg span{display:flex;align-items:center;gap:6px}.lg i{width:8px;height:8px;border-radius:2px;flex:none}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi .card{padding:10px 12px}
.kpi .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--mut)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{text-align:center;font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;height:18px}
.cal .d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:34px}
.cal .d b{width:26px;height:21px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.cal .d.past b{color:var(--mut)}.cal .d.out b{color:var(--dim)}
.cal .d.today b{border:1.5px solid var(--acc)}
.cal .dots{display:flex;gap:3px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%}
/* auth */
.auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + var(--sb))}
.auth .box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.auth .logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.auth .logo svg{width:52px;height:76px}
.auth .logo .bn{font-size:34px}
.auth .tagline{font-size:13.5px;color:var(--mut);text-align:center}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:13px;color:var(--mut);line-height:1.45}
.empty b{display:block;color:var(--tx);font-family:var(--fd);font-size:18px;margin-bottom:4px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left;color:var(--tx)}
.step .num{width:28px;height:28px;border-radius:9px;background:rgba(255,196,0,.14);color:var(--acc);font-family:var(--fd);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.step.done .num{background:rgba(61,220,151,.14);color:var(--grn)}
.step .g{flex:1}.step .g b{display:block;font-size:14px}.step .g span{font-size:12px;color:var(--mut)}
.acc-card{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--tx)}
.acc-card:first-child{border-top:0}
.acc-card .ai{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.acc-card .ai svg{width:20px;height:20px}
.acc-card .g{flex:1;min-width:0}
.acc-card .n{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-card .s{font-size:11.5px;color:var(--mut)}
.acc-card .v{font-family:var(--fd);font-weight:800;font-size:21px;white-space:nowrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--tx)}
.menu-list{display:flex;flex-direction:column}
.menu-list button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border:0;border-top:1px solid var(--line2);background:none;text-align:left;font-size:15px;font-weight:600;color:var(--tx)}
.menu-list button:first-child{border-top:0}
.menu-list svg{width:20px;height:20px;color:var(--mut);flex:none}
.menu-list .r{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.ver{text-align:center;font-size:12px;color:var(--mut)}
.row .n,.row .s,.acc-card .n,.acc-card .s{display:block}
.row .dt{width:66px}.row .dt span{white-space:nowrap}
.ov .r{grid-template-columns:minmax(0,1fr) 86px 86px}
.tile .tv{font-size:15.5px}
.sheet.tx{gap:8px}.sheet.tx .kp button{height:46px}.sheet.tx .amt .v{font-size:46px}.sheet.tx .chips.sc{margin-top:6px}
.bt .br .n2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.2;font-size:13.5px;font-weight:600}
.bt .more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:34px;border:0;border-top:1px solid var(--line2);background:transparent;font-size:12px;font-weight:600;color:var(--mut)}
[data-theme=light] .chip.on.k,[data-theme=light] .seg button.on.k{color:#fff}
[data-theme=light] .ck svg,[data-theme=light] .bt .cks svg{color:#fff}
[data-theme=light] .bt .cks{border-color:#9aa3af}
.btn svg{width:18px;height:18px;vertical-align:-3px}
button.empty{font:inherit;cursor:pointer}
@media (max-width:360px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.amt .v{font-size:44px}}

<script>
/* MoneyGladiator — pure money logic (no DOM). Works in the browser and in Node tests. */
(function (G) {
'use strict';

var BUDGET_KINDS = ['income', 'expense', 'bill', 'saving', 'debt'];
var OUT_KINDS = ['expense', 'bill', 'saving', 'debt'];

function num(v) { v = +v; return isFinite(v) ? v : 0; }
function r2(v) { return Math.round(num(v) * 100) / 100; }
function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
function pad(n) { return (n < 10 ? '0' : '') + n; }

/* ---------- dates: everything is an ISO "yyyy-mm-dd" string in local time ---------- */
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0); }
function today() { return iso(new Date()); }
function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function monthStart(s) { return String(s).slice(0, 8) + '01'; }
function monthEnd(s) { var d = parseISO(monthStart(s)); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)); }
function addMonths(s, n) {
  var d = parseISO(s), day = d.getDate();
  var x = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
  var last = new Date(x.getFullYear(), x.getMonth() + 1, 0, 12).getDate();
  x.setDate(Math.min(day, last));
  return iso(x);
}
function monthsBetween(a, b) {
  var A = parseISO(a), B = parseISO(b);
  return (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth()) + (B.getDate() >= A.getDate() ? 0 : -1);
}
function inRange(d, a, b) { return !!d && d >= a && d <= b; }

/* ---------- periods ---------- */
function sortedPeriods(D) {
  return D.periods.slice().sort(function (a, b) { return a.start_date < b.start_date ? -1 : a.start_date > b.start_date ? 1 : 0; });
}
function periodForDate(D, d) {
  for (var i = 0; i < D.periods.length; i++) { var p = D.periods[i]; if (inRange(d, p.start_date, p.end_date)) return p; }
  return null;
}
function prevPeriod(D, p) { var ps = sortedPeriods(D), i = ps.indexOf(p); if (i < 0) { for (var k = 0; k < ps.length; k++) if (ps[k].id === p.id) i = k; } return i > 0 ? ps[i - 1] : null; }
function nextPeriod(D, p) { var ps = sortedPeriods(D); for (var i = 0; i < ps.length; i++) if (ps[i].id === p.id) return ps[i + 1] || null; return null; }
/* free range for a new month period that does not overlap existing ones */
function freeMonthRange(D, anyDate) {
  var start = monthStart(anyDate), end = monthEnd(anyDate);
  D.periods.forEach(function (p) {
    if (p.end_date >= start && p.start_date <= end) {
      if (p.start_date <= anyDate && p.end_date >= anyDate) { start = null; return; }
      if (start && p.end_date < anyDate && p.end_date >= start) start = addDays(p.end_date, 1);
      if (start && p.start_date > anyDate && p.start_date <= end) end = addDays(p.start_date, -1);
    }
  });
  return start ? { start: start, end: end } : null;
}
function periodLines(D, p) { return D.lines.filter(function (l) { return l.period_id === p.id; }); }
function periodTx(D, p) {
  return D.tx.filter(function (t) { return BUDGET_KINDS.indexOf(t.kind) >= 0 && inRange(t.date, p.start_date, p.end_date); })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.created_at || '') < String(b.created_at || '') ? -1 : 1; });
}

/* ---------- budget of one period: plan vs fact (like the spreadsheet's month tab) ---------- */
function budget(D, p, memo) {
  memo = memo || {};
  if (memo[p.id]) return memo[p.id];
  memo[p.id] = { pending: true };
  var lines = periodLines(D, p), txs = periodTx(D, p);
  var byKey = {}, fact = {}, unplanned = {}, kinds = {};
  BUDGET_KINDS.forEach(function (k) { unplanned[k] = {}; kinds[k] = { plan: 0, fact: 0 }; });
  lines.forEach(function (l) {
    var key = l.kind + '|' + norm(l.name);
    (byKey[key] = byKey[key] || []).push(l);
    fact[l.id] = 0;
    kinds[l.kind].plan += num(l.planned);
  });
  Object.keys(byKey).forEach(function (k) {
    byKey[k].sort(function (a, b) { var x = a.due_date || '9999', y = b.due_date || '9999'; return x < y ? -1 : x > y ? 1 : 0; });
  });
  txs.forEach(function (t) {
    if (t.prepaid) return; /* paid from money already put on a card: counted when the card was topped up */
    var a = num(t.amount);
    kinds[t.kind].fact += a;
    var ls = byKey[t.kind + '|' + norm(t.category)];
    if (ls && ls.length) {
      var target = null, i;
      if (t.line_id) for (i = 0; i < ls.length; i++) if (ls[i].id === t.line_id) target = ls[i];
      if (!target) for (i = 0; i < ls.length; i++) if (fact[ls[i].id] + 0.005 < num(ls[i].planned)) { target = ls[i]; break; }
      if (!target) target = ls[ls.length - 1];
      fact[target.id] += a;
    } else {
      var name = String(t.category || '').trim() || '—', nk = norm(name);
      var u = unplanned[t.kind][nk] || (unplanned[t.kind][nk] = { kind: t.kind, name: name, fact: 0, count: 0 });
      u.fact += a; u.count++;
    }
  });
  var rows = lines.map(function (l) {
    var f = r2(fact[l.id]), pl = r2(l.planned);
    return { line: l, plan: pl, fact: f, rem: r2(pl - f), pct: pl > 0 ? f / pl : null };
  });
  var unp = [];
  BUDGET_KINDS.forEach(function (k) {
    Object.keys(unplanned[k]).forEach(function (n) { var u = unplanned[k][n]; u.fact = r2(u.fact); unp.push(u); });
  });
  BUDGET_KINDS.forEach(function (k) { kinds[k].plan = r2(kinds[k].plan); kinds[k].fact = r2(kinds[k].fact); });

  var prev = prevPeriod(D, p), auto = p.rollover == null || p.rollover === '';
  var roll = 0;
  if (!auto) roll = num(p.rollover);
  else if (prev) { var pb = memo[prev.id] && !memo[prev.id].pending ? memo[prev.id] : budget(D, prev, memo); roll = pb.pending ? 0 : pb.leftFact; }

  var outPlan = 0, outFact = 0;
  OUT_KINDS.forEach(function (k) { outPlan += kinds[k].plan; outFact += kinds[k].fact; });

  var fIn = 0, fOut = 0;
  rows.forEach(function (r) {
    var v = r.line.done ? r.fact : Math.max(r.plan, r.fact);
    if (r.line.kind === 'income') fIn += v; else fOut += v;
  });
  unp.forEach(function (u) { if (u.kind === 'income') fIn += u.fact; else fOut += u.fact; });

  var res = {
    period: p, prev: prev, rows: rows, unplanned: unp, kinds: kinds,
    rollover: r2(roll), rolloverAuto: auto,
    outPlan: r2(outPlan), outFact: r2(outFact),
    leftPlan: r2(roll + kinds.income.plan - outPlan),
    leftFact: r2(roll + kinds.income.fact - outFact),
    forecast: r2(roll + fIn - fOut)
  };
  memo[p.id] = res;
  return res;
}

/* day-by-day balance: actual records + what is still planned (for the forecast chart) */
function forecastSeries(D, p, todayStr, memo) {
  var B = budget(D, p, memo);
  var start = p.start_date, end = p.end_date, n = daysBetween(start, end) + 1;
  var deltas = [], i;
  for (i = 0; i < n; i++) deltas.push(0);
  periodTx(D, p).forEach(function (t) {
    if (t.prepaid) return;
    var k = daysBetween(start, t.date), a = num(t.amount);
    deltas[k] += t.kind === 'income' ? a : -a;
  });
  var tc = todayStr < start ? start : todayStr > end ? end : todayStr, ti = daysBetween(start, tc), undated = 0;
  B.rows.forEach(function (r) {
    if (r.line.done || r.rem <= 0.004) return;
    var sign = r.line.kind === 'income' ? 1 : -1, d = r.line.due_date;
    if (!d) {
      if (r.line.kind === 'expense') { var left = n - ti; for (var j = ti; j < n; j++) deltas[j] -= r.rem / left; return; }
      undated += sign * r.rem; return;
    }
    if (d < tc) d = tc;
    if (d > end) d = end;
    deltas[daysBetween(start, d)] += sign * r.rem;
  });
  var bal = [], cur = B.rollover, min = cur, minIdx = 0, max = cur, maxIdx = 0;
  for (i = 0; i < n; i++) {
    cur += deltas[i];
    bal.push(r2(cur));
    if (cur < min) { min = cur; minIdx = i; }
    if (cur > max) { max = cur; maxIdx = i; }
  }
  return { start: start, end: end, n: n, bal: bal, undated: r2(undated), final: r2(cur + undated), todayIdx: ti,
    rollover: B.rollover, min: r2(min), minIdx: minIdx, max: r2(max), maxIdx: maxIdx };
}

/* lines that still wait for money, by due date (for "Next 7 days") */
function upcoming(D, todayStr, days, memo) {
  var to = addDays(todayStr, days), from = addDays(todayStr, -45), out = [];
  D.periods.forEach(function (p) {
    if (p.end_date < from) return;
    var B = budget(D, p, memo);
    B.rows.forEach(function (r) {
      var l = r.line;
      if (l.kind === 'expense' || l.done || !l.due_date || r.rem <= 0.004) return;
      if (l.due_date > to || l.due_date < from) return;
      out.push({ line: l, period: p, rem: r.rem, plan: r.plan, fact: r.fact, overdue: l.due_date < todayStr, days: daysBetween(todayStr, l.due_date) });
    });
  });
  return out.sort(function (a, b) { return a.line.due_date < b.line.due_date ? -1 : a.line.due_date > b.line.due_date ? 1 : (a.line.kind === 'income' ? -1 : 1); });
}
function undatedOpen(D, p, memo) {
  return budget(D, p, memo).rows.filter(function (r) {
    var l = r.line; return l.kind !== 'expense' && !l.done && !l.due_date && r.rem > 0.004;
  });
}

/* ---------- accounts ---------- */
function accountEffect(acc, t) {
  if (!acc || t.date < acc.opening_date) return 0;
  var a = num(t.amount), e = 0;
  if (t.account_id === acc.id) {
    if (t.kind === 'income' || t.kind === 'adjust') e += a;
    else if (t.kind !== 'goal') e -= a;
  }
  if (t.to_account_id === acc.id && t.kind !== 'income' && t.kind !== 'adjust' && t.kind !== 'goal') e += a;
  return e;
}
function accountBalance(D, acc, upto) {
  var b = num(acc.opening_balance);
  D.tx.forEach(function (t) { if (upto && t.date > upto) return; b += accountEffect(acc, t); });
  return r2(b);
}
function accountFlow(D, acc, from, to) {
  var inc = 0, out = 0;
  D.tx.forEach(function (t) {
    if (!inRange(t.date, from, to)) return;
    var e = accountEffect(acc, t);
    if (e > 0) inc += e; else out -= e;
  });
  return { in: r2(inc), out: r2(out) };
}
function accountsTotals(D) {
  var cash = 0, credit = 0;
  D.accounts.forEach(function (a) {
    if (a.archived) return;
    var b = accountBalance(D, a);
    if (a.kind === 'credit') credit += b; else cash += b;
  });
  return { cash: r2(cash), credit: r2(credit), net: r2(cash + credit) };
}

/* ---------- goals: savings funds, debts, money owed to me ---------- */
function goalStats(D, g, todayStr) {
  var sum = 0, entries = [];
  D.tx.forEach(function (t) {
    if (t.goal_id !== g.id) return;
    var ok = g.kind === 'saving' ? (t.kind === 'saving' || t.kind === 'goal')
      : g.kind === 'debt' ? (t.kind === 'debt' || t.kind === 'bill' || t.kind === 'goal')
      : (t.kind === 'income' || t.kind === 'goal');
    if (!ok) return;
    sum += num(t.amount); entries.push(t);
  });
  entries.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  todayStr = todayStr || today();
  if (g.kind === 'saving') {

function saveCache() { try { Store.set(cacheKey(), JSON.stringify({ d: D, p: P, at: Date.now() })); } catch (e) { /* storage full */ } }
function loadCache() {
  try {
    var c = JSON.parse(Store.get(cacheKey()) || 'null');
    if (c && c.d) { D = normD(c.d); P = Object.assign({ currency: '$', lastAcc: {} }, c.p || {}); dirty(); return true; }
  } catch (e) { /* ignore */ }
  return false;
}
function normD(d) { return { accounts: d.accounts || [], periods: d.periods || [], lines: d.lines || [], goals: d.goals || [], tx: d.tx || [] }; }
function saveQ() { Store.set(qKey(), JSON.stringify(S.queue)); }
function loadQ() { try { S.queue = JSON.parse(Store.get(qKey()) || '[]') || []; } catch (e) { S.queue = []; } }

function put(coll, row) {
  if (!row.id) row.id = uuid();
  var arr = D[coll];
  for (var i = 0; i < arr.length; i++) if (arr[i].id === row.id) { arr[i] = Object.assign({}, arr[i], row); return arr[i]; }
  if (!row.created_at) row.created_at = new Date().toISOString();
  arr.push(row);
  return row;
}
function unput(coll, id) { D[coll] = D[coll].filter(function (x) { return x.id !== id; }); }
function commit(ops) {
  dirty(); saveCache();
  ops.forEach(function (o) {
    if (o.op === 'up') S.queue.push({ op: 'up', coll: o.coll, row: pick(o.coll, o.row) });
    else if (o.op === 'upm') { if (o.rows.length) S.queue.push({ op: 'upm', coll: o.coll, rows: o.rows.map(function (r) { return pick(o.coll, r); }) }); }
    else if (o.op === 'del') S.queue.push({ op: 'del', coll: o.coll, id: o.id });
    else if (o.op === 'set') { S.queue = S.queue.filter(function (q) { return q.op !== 'set'; }); S.queue.push({ op: 'set', prefs: JSON.parse(JSON.stringify(P)) }); }
  });
  saveQ(); setSync(); flush();
}
function upsert(coll, row) { var r = put(coll, row); commit([{ op: 'up', coll: coll, row: r }]); return r; }
function del(coll, id) { unput(coll, id); commit([{ op: 'del', coll: coll, id: id }]); }
function savePrefs() { commit([{ op: 'set' }]); }

var flushing = false, retryT = null;
function isNetErr(e) {
  var m = String((e && (e.message || e.details)) || e || '');
  return !e || !e.code || /fetch|network|load failed|timeout|abort|jwt|token/i.test(m) || e.code === 'PGRST301';
}
async function flush() {
  if (flushing || !sb || !S.user || !S.queue.length) { setSync(); return; }
  flushing = true; setSync();
  try {
    while (S.queue.length) {
      var o = S.queue[0], r = null;
      if (o.op === 'up') r = await sb.from(TBL[o.coll]).upsert(o.row);
      else if (o.op === 'upm') r = await sb.from(TBL[o.coll]).upsert(o.rows);
      else if (o.op === 'del') r = await sb.from(TBL[o.coll]).delete().eq('id', o.id);
      else if (o.op === 'set') r = await sb.from('settings').upsert({ user_id: S.user.id, prefs: o.prefs });
      if (r && r.error) {
        if (isNetErr(r.error)) { S.sync = 'off'; break; }
        console.warn('sync error', r.error, o);
        toast(t('t.syncErr', { e: r.error.message || r.error.code }), 6000);
      }
      S.queue.shift(); saveQ();
    }
    if (!S.queue.length) S.sync = 'ok';
  } catch (e) { S.sync = 'off'; }
  flushing = false; setSync();
  if (S.queue.length) { clearTimeout(retryT); retryT = setTimeout(flush, 15000); }
}
async function fetchAll(table, order) {
  var out = [], from = 0, size = 1000;
  for (;;) {
    var r = await order(sb.from(table).select('*')).range(from, from + size - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data || []);
    if (!r.data || r.data.length < size) break;
    from += size;
  }
  return out;
}
async function loadAll() {
  if (!sb || !S.user) return false;
  try {
    await flush();
    if (S.queue.length) return false;
    var res = await Promise.all([
      fetchAll('accounts', function (q) { return q.order('sort').order('created_at'); }),
      fetchAll('periods', function (q) { return q.order('start_date'); }),
      fetchAll('lines', function (q) { return q.order('sort').order('created_at'); }),
      fetchAll('goals', function (q) { return q.order('sort').order('created_at'); }),
      fetchAll('transactions', function (q) { return q.order('date', { ascending: false }).order('created_at', { ascending: false }); }),
      sb.from('settings').select('prefs').maybeSingle()
    ]);
    if (S.queue.length) return false;
    D = { accounts: res[0], periods: res[1], lines: res[2], goals: res[3], tx: res[4] };
    if (res[5] && res[5].data && res[5].data.prefs) P = Object.assign({ currency: '$', lastAcc: {} }, res[5].data.prefs);
    dirty(); saveCache(); S.sync = 'ok'; S.loadedAt = Date.now(); setSync();
    return true;
  } catch (e) { console.warn('load failed', e); S.sync = 'off'; setSync(); return false; }
}
function setSync() {
  var el = $('#sync'); if (!el) return;
  var st = S.queue.length ? (S.sync === 'off' ? 'off' : 'pend') : (S.sync === 'off' ? 'off' : 'ok');
  el.className = 'sync' + (st === 'ok' ? '' : ' ' + st);
  el.setAttribute('aria-label', st === 'ok' ? t('t.synced') : st === 'pend' ? t('t.syncing') : t('t.offline'));
  el.title = el.getAttribute('aria-label');
}

/* ---------------- periods ---------------- */
function latestBefore(start) { var ps = C.sortedPeriods(D).filter(function (p) { return p.start_date < start; }); return ps[ps.length - 1] || null; }
function monthsDiff(a, b) { var A = C.parseISO(a), B = C.parseISO(b); return (B.getFullYear() - A.getFullYear()) * 12 + B.getMonth() - A.getMonth(); }
function linesCopy(src, p) {
  var md = monthsDiff(src.start_date, p.start_date);
  return C.periodLines(D, src).map(function (l) {
    return { id: uuid(), period_id: p.id, kind: l.kind, name: l.name, planned: l.planned, due_date: l.due_date ? C.addMonths(l.due_date, md) : null, done: false, goal_id: l.goal_id || null, sort: l.sort || 0 };
  });
}
function linesDefault(p) { return defaultCats().map(function (n, i) { return { id: uuid(), period_id: p.id, kind: 'expense', name: n, planned: 0, due_date: null, done: false, goal_id: null, sort: i }; }); }
function createPeriodFor(d, opts) {
  opts = opts || {};
  var rng = C.freeMonthRange(D, d);
  if (!rng) return C.periodForDate(D, d);
  var p = put('periods', { id: uuid(), name: '', start_date: rng.start, end_date: rng.end, rollover: null });
  var rows = [];
  if (opts.copy) { var src = latestBefore(rng.start); if (src) rows = linesCopy(src, p); }
  if (!rows.length && opts.defaults) rows = linesDefault(p);
  rows = rows.map(function (r) { return put('lines', r); });
  commit([{ op: 'up', coll: 'periods', row: p }, { op: 'upm', coll: 'lines', rows: rows }]);
  return p;
}
function ensureToday() {
  var td = C.today(), made = null;
  if (!D.periods.length) made = createPeriodFor(td, { defaults: true });
  else if (!C.periodForDate(D, td)) {
    var last = C.sortedPeriods(D).slice(-1)[0];
    if (last && last.end_date < td) {
      made = createPeriodFor(td, { copy: true, defaults: true });
      if (made) toast(t('t.newMonth', { m: pName(made) }), 5000);
    }
  }
  if (made) S.perId = made.id;
  if (!S.perId || !find(D.periods, S.perId)) { var p = C.periodForDate(D, td) || C.sortedPeriods(D).slice(-1)[0]; S.perId = p ? p.id : null; }
}

function forecastChart(F) {
  var top = 8, bot = 64, x0 = 4, x1 = F.undated ? 288 : 326;
  var vals = F.bal.concat([F.final, 0, F.rollover]), mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx - mn < 1) { mx += 1; mn -= 1; }
  var pd = (mx - mn) * 0.06; mn -= pd; mx += pd;
  function X(i) { return x0 + i / F.n * (x1 - x0); }
  function Y(v) { return bot - (v - mn) / (mx - mn) * (bot - top); }
  var d = 'M' + x0 + ' ' + Y(F.rollover).toFixed(1), i;
  for (i = 0; i < F.n; i++) d += ' V' + Y(F.bal[i]).toFixed(1) + ' H' + X(i + 1).toFixed(1);
  var s = '<svg class="chart" viewBox="0 0 330 84" role="img" aria-label="' + esc(t('h.fc') + ': ' + money(F.final)) + '" style="margin-top:6px">';
  if (mn < 0 && mx > 0) s += '<path d="M' + x0 + ' ' + Y(0).toFixed(1) + ' H326" stroke="var(--line)" stroke-dasharray="2 3" fill="none"/>';
  var tx = X(F.todayIdx + 0.5);
  s += '<path d="M' + tx.toFixed(1) + ' 2 V' + bot + '" stroke="var(--acc)" stroke-width="1.5" fill="none"/>';
  s += '<text x="' + (tx + 4 > 280 ? tx - 4 : tx + 4).toFixed(1) + '" y="9" font-size="9.5" font-weight="600" fill="var(--acc)" text-anchor="' + (tx + 4 > 280 ? 'end' : 'start') + '">' + t('h.today') + '</text>';
  s += '<path d="' + d + '" stroke="var(--grn)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>';
  var endY = Y(F.bal[F.n - 1]), finY = Y(F.final), fc = F.final < 0 ? 'var(--red)' : 'var(--grn)';
  if (F.undated) s += '<path d="M' + x1 + ' ' + endY.toFixed(1) + ' H' + (x1 + 14) + ' V' + finY.toFixed(1) + ' H323" stroke="' + fc + '" stroke-width="2" stroke-dasharray="4 3" fill="none"/>';
  s += '<circle cx="324" cy="' + finY.toFixed(1) + '" r="3.2" fill="' + fc + '"/>';
  s += '<text x="326" y="' + Math.max(10, Math.min(finY - 6, 58)).toFixed(1) + '" font-size="10" font-weight="700" fill="' + fc + '" text-anchor="end">' + esc(money0(F.final)) + '</text>';
  if (F.max > F.final + 1 && F.maxIdx > 0) {
    var mxX = X(F.maxIdx + 0.5), mxY = Y(F.max);
    s += '<text x="' + Math.min(mxX, 250).toFixed(1) + '" y="' + Math.max(mxY - 4, 9).toFixed(1) + '" font-size="10" font-weight="600" fill="var(--tx)" text-anchor="middle">' + esc(money0(F.max)) + '</text>';
  }
  var a = C.parseISO(F.start), mid = Math.floor(F.n / 2);
  s += '<text x="' + x0 + '" y="80" font-size="9.5" fill="var(--mut)">' + esc(dShort(F.start)) + '</text>';
  s += '<text x="' + X(mid).toFixed(1) + '" y="80" font-size="9.5" fill="var(--mut)" text-anchor="middle">' + esc(dShort(C.addDays(F.start, mid))) + '</text>';
  s += '<text x="' + x1 + '" y="80" font-size="9.5" fill="var(--mut)" text-anchor="end">' + esc(dShort(F.end)) + '</text>';
  if (F.undated) s += '<text x="326" y="80" font-size="9.5" fill="var(--mut)" text-anchor="end"></text>';
  a = null;
  return s + '</svg>' + (F.undated ? '<div class="hint" style="text-align:right;margin-top:-2px">' + esc(t('h.undatedChart')) + ': ' + money0(F.undated) + '</div>' : '');
}

async function authGo() {
  if (!sb) return authMsg(t('auth.nosdk'), 'err');
  var em = $('#au-email').value.trim(), pw = $('#au-pass').value; S.authEmail = em;
  if (!em || !pw) return authMsg(t('auth.need'), 'err');
  var btn = $('#au-go'); btn.disabled = true; authMsg(t('auth.wait'));
  try {
    if (S.authMode === 'up') {
      if (pw.length < 6) { authMsg(t('auth.short'), 'err'); return; }
      var res = await fetch(CFG.url + '/functions/v1/signup', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.key }, body: JSON.stringify({ email: em, password: pw }) });
      var j = {}; try { j = await res.json(); } catch (e) { j = {}; }
      if (!res.ok) {
        authMsg(j.error === 'exists' ? t('auth.exists') : j.error === 'bad_email' ? t('auth.badEmail') : j.error === 'bad_password' ? t('auth.short') : (j.error || ('HTTP ' + res.status)), 'err');
        if (j.error === 'exists') { S.authMode = 'in'; renderAuth(t('auth.exists'), 'err'); }
        return;

    }
    var r = await sb.auth.signInWithPassword({ email: em, password: pw });
    if (r.error) authMsg(authErr(r.error), 'err');
    else if (r.data && r.data.session) handleSession(r.data.session);

  var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split('#')[0].split('?')[0] });

    if (S.user && S.user.id === session.user.id) return;
    S.user = session.user;
    $('#auth').hidden = true; $('#app').hidden = false;
    if (starting) return; starting = true;

    var ok = await loadAll();
    if (ok) ensureToday(); else if (!had) ensureToday();

  } else {

    var a = find(D.accounts, ACC.id); if (!a) return;
    confirmSheet(t('a.delQ', { n: a.name }), t('c.delete'), function () {
      D.tx.forEach(function (x) { if (x.account_id === a.id) x.account_id = null; if (x.to_account_id === a.id) x.to_account_id = null; });
      del('accounts', a.id); if (S.page === 'account') { S.page = 'accounts'; } render(); toast(t('t.deleted'));
    }, true);
  },
  transfer: function (el) {
    var acs = activeAccs(), from = (el.dataset.from && find(D.accounts, el.dataset.from)) || defAcc('transfer') || acs[0];
    var to = acs.filter(function (a) { return !from || a.id !== from.id; })[0];
    openTx(null, { kind: 'transfer', account_id: from ? from.id : null, to_account_id: to ? to.id : null });
  },
  reconcile: function (el) { var a = find(D.accounts, el.dataset.id); if (a) openReconcile(a); },
  recSave: function (el) {
    var a = find(D.accounts, el.dataset.id); if (!a) return;
    var v = parseMoney($('#rc-v').value); if (!isFinite(v)) { toast(t('tx.needAmt')); return; }
    var diff = C.r2(v - C.accountBalance(D, a));
    closeSheet();
    if (Math.abs(diff) < 0.005) { toast(t('a.recSame')); return; }
    upsert('tx', { id: uuid(), date: C.today(), kind: 'adjust', category: t('def.adjust'), amount: diff, account_id: a.id, to_account_id: null, goal_id: null, line_id: null, note: null, source: 'manual' });
    rerender(); toast(t('a.recDiff', { v: (diff > 0 ? '+' : '−') + money(Math.abs(diff)) }));
  },
  goal: function (el) { S.goalId = el.dataset.id; go('goal'); },
  goalNew: function (el) { openGoal(null, el.dataset.k); },
  goalEdit: function (el) { var g = find(D.goals, el.dataset.id || S.goalId); if (g) openGoal(g); },
  glKind: function (el) { var n = $('#gl-name').value; GL.kind = el.dataset.k; GL.name = n; openGoal(null, GL.kind); $('#gl-name').value = n; },
  goalSave: function () { goalSave(); },
  goalClose: function () { var g = find(D.goals, GL.id); if (!g) return; upsert('goals', Object.assign({}, g, { closed: !g.closed })); closeSheet(); rerender(); },
  goalDel: function () {
    var g = find(D.goals, GL.id); if (!g) return;
    confirmSheet(t('g.delQ', { n: g.name }), t('c.delete'), function () {
      D.tx.forEach(function (x) { if (x.goal_id === g.id) x.goal_id = null; }); D.lines.forEach(function (l) { if (l.goal_id === g.id) l.goal_id = null; });
      del('goals', g.id); if (S.page === 'goal') S.page = 'goals'; render(); toast(t('t.deleted'));
    }, true);
  },
  goalAdd: function (el) {
    var g = find(D.goals, el.dataset.id); if (!g) return;
    var k = g.kind === 'saving' ? 'saving' : g.kind === 'debt' ? 'debt' : 'income';
    openTx(null, { kind: k, goal_id: g.id, category: g.name });
  },
  goalCorr: function (el) { var g = find(D.goals, el.dataset.id); if (g) openCorr(null, { kind: 'goal', goal_id: g.id, sign: 1 }); },
  statTab: function (el) { S.statTab = el.dataset.v; rerender(); },
  showEmpty: function () { S.showEmpty = !S.showEmpty; rerender(); },
  onlyExp: function (el) { S.onlyExp = el.dataset.v === '1'; rerender(); },
  onbHide: function () { P.onbHidden = true; savePrefs(); rerender(); },
  lang: function (el) {
    LANG = el.dataset.v; Store.set('mg_lang', LANG); applyLang();
    if (S.user) { var wasMenu = SHEET && $('#mn-cur'); if (wasMenu) openMenu(); render(); } else renderAuth();
  },
  theme: function (el) { THEME = el.dataset.v; Store.set('mg_theme', THEME); applyTheme(); if (SHEET && $('#mn-cur')) openMenu(); },
  csvPeriod: function () { var p = curP(); download('moneygladiator-' + (p ? p.start_date.slice(0, 7) : 'all') + '.csv', '﻿' + csvOf(txFiltered()), 'text/csv;charset=utf-8'); },
  csvAll: function () { download('moneygladiator-all-' + C.today() + '.csv', '﻿' + csvOf(D.tx), 'text/csv;charset=utf-8'); },
  backup: function () { download('moneygladiator-backup-' + C.today() + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), data: D, prefs: P }, null, 1), 'application/json'); },
  syncNow: async function () { closeSheet(); toast(t('t.syncing')); var ok = await loadAll(); if (ok) { ensureToday(); render(); } toast(ok ? t('t.synced') : t('t.offline')); },
  passSheet: function () { openPass(); },
  passSave: async function () {
    var v = $('#np-v').value; if (v.length < 6) { toast(t('auth.short')); return; }
    var r = await sb.auth.updateUser({ password: v }); closeSheet(); toast(r.error ? authErr(r.error) : t('auth.passOk'), 4000);
  },
  logout: async function () {
    closeSheet();
    if (S.queue.length) await flush();
    try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
    handleSession(null);
  },
  authMode: function (el) { S.authMode = el.dataset.m; var em = $('#au-email'); if (em) S.authEmail = em.value; renderAuth(); },
  authGo: function () { authGo(); },
  authForgot: function () { authForgot(); }
};
var CHG = {
  peAuto: function (el) { $('#pe-rw').hidden = el.checked; },
  currency: function (el) { var v = el.value.trim() || '$'; P.currency = v.slice(0, 4); savePrefs(); render(); }
};
var INP = {
  txQ: function (el) { S.txQ = el.value; var box = $('#tx-list'); if (box) { dirty(); box.innerHTML = txListHtml(); } },
  txDate: function (el) { if (TX) { TX.date = el.value || C.today(); txRefresh(); } },
  recDiff: function (el) {
    var a = find(D.accounts, el.dataset.id); if (!a) return;
    var v = parseMoney(el.value), d = isFinite(v) ? C.r2(v - C.accountBalance(D, a)) : null;
    $('#rc-d').textContent = d == null ? '' : Math.abs(d) < 0.005 ? t('a.recSame') : t('a.recDiff', { v: (d > 0 ? '+' : '−') + money(Math.abs(d)) });
  }
};
document.addEventListener('click', function (e) {
  var bg = $('#sheet-bg');
  if (e.target === bg) { closeSheet(); return; }
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.chg && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', function (e) { var el = e.target; if (el.dataset && el.dataset.inp && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && SHEET) { closeSheet(); return; }
  var tag = (e.target && e.target.tagName) || '';
  if (e.key === 'Enter' && e.target && e.target.id === 'au-pass') { authGo(); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'tx-newcat') { ACT.txCatOk(); e.preventDefault(); return; }
  if (!TX || !SHEET || !SHEET.tx || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (/^[0-9]$/.test(e.key)) { kpPress(e.key); e.preventDefault(); }
  else if (e.key === '.' || e.key === ',') { kpPress('.'); e.preventDefault(); }
  else if (e.key === 'Backspace') { kpPress('back'); e.preventDefault(); }
  else if (e.key === 'Enter') { txSave(); e.preventDefault(); }
});
window.addEventListener('popstate', function () {
  if (SHEET) { closeSheet(); try { history.pushState({ p: S.page }, ''); } catch (e) { /* ignore */ } return; }
  if (S.user && S.hist.length) goBack();
});
window.addEventListener('online', function () { if (S.user) flush(); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.user && !SHEET && Date.now() - S.loadedAt > 60000) loadAll().then(function (ok) { if (ok) { ensureToday(); rerender(); } });
});

/* ---------------- start ---------------- */
function init() {
  applyTheme(); applyLang();
  if (!sb) { $('#app').hidden = true; $('#auth').hidden = false; renderAuth(t('auth.nosdk'), 'err'); $('#boot').hidden = true; return; }
  sb.auth.getSession().then(function (r) { handleSession(r && r.data && r.data.session); }).catch(function () { handleSession(null); });
  sb.auth.onAuthStateChange(function (ev, s) {
    if (ev === 'PASSWORD_RECOVERY') setTimeout(openPass, 600);
    if (!s && S.user) handleSession(null);
    else if (s && s.user && (!S.user || S.user.id !== s.user.id)) handleSession(s);
  });
}
window.__mg = { S: S, get D() { return D; }, P: P, C: C, render: render, budget: budget, t: t };
init();
})();

</script>
</body>
