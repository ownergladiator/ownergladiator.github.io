*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.4;min-height:100vh;font-size:15px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:21px;white-space:nowrap;min-width:0}
.brand svg{height:30px;width:auto;flex:none}
.bn-g{color:var(--acc)}
@media (prefers-color-scheme:light){.bn-g{color:#a87800}}
.ro{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.ttl{font-family:var(--fd);font-size:26px;font-weight:800;line-height:1.1}
.cs{font-size:12.5px;color:var(--mut)}
.ct{font-family:var(--fd);font-size:20px;font-weight:700;margin-bottom:10px}
.hl{font-size:12.5px;color:var(--mut)}
.net{font-family:var(--fd);font-size:clamp(44px,13vw,66px);font-weight:800;line-height:1;color:var(--acc);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.net.neg{color:var(--red)}
.hsub{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:13px;margin-top:8px;color:var(--mut)}
.hsub b.g{color:var(--grn)}.hsub b.r{color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border-left:3px solid var(--c,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--c,transparent) 10%,var(--card2)),var(--card2) 55%);border-radius:12px;padding:10px 11px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .l{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ic{margin-right:5px;font-size:13px}
.tv{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;flex-wrap:wrap;margin-top:3px}
.tile .v{font-family:var(--fd);font-size:23px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.wide .v{font-size:28px}
.d{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--tx) 9%,transparent);color:var(--mut);white-space:nowrap}
.d.g{background:color-mix(in srgb,var(--grn) 16%,transparent);color:var(--grn)}.d.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.tile .s{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .st{width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center;flex:1}
.bar i{display:block;width:44%;max-width:26px;border-radius:5px 5px 2px 2px;min-height:3px}
.bar i.g{background:var(--acc)}.bar i.n{background:var(--grn)}.bar i.n.neg{background:var(--red)}
.bar small{font-size:10.5px;color:var(--mut);white-space:nowrap}
.bar.lv small{color:var(--grn);font-weight:700}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--k)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th{font-size:11px;color:var(--mut);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

td.neg{color:var(--red)}
.lane{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.lane:first-of-type{border-top:0}

.lane .k{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .m{font-size:12px;color:var(--mut);white-space:nowrap}.lane .r{font-weight:800;color:var(--grn);white-space:nowrap}
.mapc{position:relative;width:100%;aspect-ratio:16/10.5;border-radius:12px;overflow:hidden;background:var(--mw)}
@media(max-width:600px){.mapc{aspect-ratio:1/0.92}}
.mapc svg{display:block;width:100%;height:100%}
.m-nb{fill:var(--mnb);stroke:var(--mnb);stroke-width:1.2;fill-rule:evenodd}
.m-st{fill:var(--mland);stroke:var(--mbd);stroke-width:.9;fill-rule:evenodd;stroke-linejoin:round}
.m-st.x{fill:color-mix(in oklch,var(--acc) 7%,var(--mland))}
.m-st.h1{fill:color-mix(in oklch,var(--acc) 8%,var(--mland))}.m-st.h2{fill:color-mix(in oklch,var(--acc) 14%,var(--mland))}.m-st.h3{fill:color-mix(in oklch,var(--acc) 21%,var(--mland))}
.m-lk{fill:var(--mw);stroke:var(--mbd);stroke-width:.6;fill-rule:evenodd}
.rt-c{fill:none;stroke:var(--mcase);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.seg-ld{fill:none;stroke:var(--grn);stroke-linecap:round;stroke-linejoin:round}
.seg-dh{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round}
.mk circle{fill:var(--acc);stroke:var(--mcase);stroke-width:2.5}
.mk text{fill:var(--tx);font:700 12.5px var(--fb);paint-order:stroke;stroke:var(--mhalo);stroke-width:3.5px;stroke-linejoin:round}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:8px}.mleg .g{color:var(--grn)}.mleg .r{color:var(--red)}
.msg{text-align:center;padding:40px 18px}.msg .big{font-size:44px}.msg b{display:block;font-size:18px;margin:10px 0 6px}
footer{font-size:12px;color:var(--dim);text-align:center;padding:6px 0 0;line-height:1.6}
footer a{color:var(--acc);text-decoration:none;font-weight:700}
@media(min-width:1000px){
 .wrap{padding:24px 32px 48px}

}

function sv(tag,at){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);return e;}
function drawMap(box,m){
 fetch('../map-us.json?v=1').then(function(r){return r.json();}).then(function(j){
  var q=j.q,arcs=j.arcs.map(function(s){return mdec(s,q);});
  function ring(ids){var o=[];ids.forEach(function(id){var a=id<0?arcs[~id].slice().reverse():arcs[id];o=o.length?o.concat(a.slice(1)):a.slice();});return o;}
  var st=j.st.map(function(s){return{c:s.c,d:s.r.map(function(r){return lineD(ring(r))+'Z';}).join('')};});
  var nbD=j.nb.map(function(s){return lineD(mdec(s,q))+'Z';}).join(''),lkD=j.lk.map(function(s){return lineD(mdec(s,q))+'Z';}).join('');
  var legs=m.legs.map(function(l){return{t:l.t==='dh'?'dh':'ld',w:Math.min(10,Math.max(1,+l.w||3)),p:mdec(String(l.p||''),0.5)};}).filter(function(l){return l.p.length>1;});
  var stops=(m.stops||[]).map(function(s){return{x:+s.x,y:+s.y,r:Math.min(12,Math.max(3,+s.r||5)),l:String(s.l||''),p:+s.p||0};}).filter(function(s){return isFinite(s.x)&&isFinite(s.y);});
  var shade=m.shade||{};
  function paint(){
   var W=Math.max(240,box.clientWidth||360),H=Math.max(180,box.clientHeight||300),pts=[];legs.forEach(function(l){pts=pts.concat(l.p);});stops.forEach(function(s){pts.push([s.x,s.y]);});
   var b=[1e9,1e9,-1e9,-1e9];pts.forEach(function(p){b[0]=Math.min(b[0],p[0]);b[1]=Math.min(b[1],p[1]);b[2]=Math.max(b[2],p[0]);b[3]=Math.max(b[3],p[1]);});
   if(!pts.length)b=j.us.slice();
   var bw=Math.max(b[2]-b[0],420),bh=Math.max(b[3]-b[1],252),pad=Math.min(46,W*0.1),k=Math.min((W-2*pad)/bw,(H-2*pad)/bh),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
   var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'routes map'}),g=sv('g',{transform:'matrix('+k+' 0 0 '+k+' '+(W/2-cx*k)+' '+(H/2-cy*k)+')'});
   g.appendChild(sv('path',{'class':'m-nb','vector-effect':'non-scaling-stroke',d:nbD}));
   st.forEach(function(s){var c=shade[s.c];g.appendChild(sv('path',{'class':'m-st'+(/^(x|h[123])$/.test(c||'')?' '+c:''),'vector-effect':'non-scaling-stroke',d:s.d}));});
   g.appendChild(sv('path',{'class':'m-lk','vector-effect':'non-scaling-stroke',d:lkD}));
   legs.forEach(function(l){g.appendChild(sv('path',{'class':'rt-c',d:lineD(l.p),style:'stroke-width:'+((l.w+(l.t==='ld'?3.2:2.4))/k)}));});
   legs.forEach(function(l){var at={'class':l.t==='ld'?'seg-ld':'seg-dh',d:lineD(l.p),style:'stroke-width:'+(l.w/k)+(l.t==='dh'?';stroke-dasharray:'+(8/k)+' '+(6/k):'')};g.appendChild(sv('path',at));});
   svg.appendChild(g);
   var ov=sv('g',{}),boxes=[];
   function sx(s){return[(s.x-cx)*k+W/2,(s.y-cy)*k+H/2];}
   function free(r){if(r[0]<2||r[2]>W-2||r[1]<2||r[3]>H-2)return false;for(var i=0;i<boxes.length;i++){var c=boxes[i];if(r[0]<c[2]&&r[2]>c[0]&&r[1]<c[3]&&r[3]>c[1])return false;}return true;}
   stops.forEach(function(s){var p=sx(s);boxes.push([p[0]-s.r-2,p[1]-s.r-2,p[0]+s.r+2,p[1]+s.r+2]);});
   stops.slice().sort(function(a,b){return b.p-a.p;}).forEach(function(s){var p=sx(s),gg=sv('g',{'class':'mk',transform:'translate('+mr(p[0])+' '+mr(p[1])+')'});gg.appendChild(sv('circle',{r:s.r}));
    var lb=s.l.length>16?s.l.slice(0,15)+'…':s.l,lw=lb.length*7.2+6;
    if(lb){var R=[p[0]+s.r+2,p[1]-8,p[0]+s.r+6+lw,p[1]+8],Lb=[p[0]-s.r-6-lw,p[1]-8,p[0]-s.r-2,p[1]+8],side=free(R)?1:(free(Lb)?-1:0);
     if(side){var tx=sv('text',{x:side*(s.r+4),y:4.5,'text-anchor':side>0?'start':'end'});tx.textContent=lb;gg.appendChild(tx);boxes.push(side>0?R:Lb);}}
    ov.appendChild(gg);});
   svg.appendChild(ov);box.textContent='';box.appendChild(svg);
  }
  paint();var t=null;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(paint,150);});
 }).catch(function(){box.parentNode.removeChild(box);});
}
})();
</script>
