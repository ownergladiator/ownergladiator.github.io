<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{color-scheme:dark;
--bg:#0d0f12;--bg2:#101318;--card:#15181d;--card2:#1b1f26;--line:#2a2f38;--tx:#f4f4f2;--mut:#9aa1ad;--dim:#6c7480;
--acc:#ffc400;--ink:#171200;--grn:#3ddc97;--red:#ff5a5f;--blu:#5cc8ff;--vio:#b39cff;
--fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--fb:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
body.light{color-scheme:light;--bg:#e6e9ed;--bg2:#dde1e7;--card:#ffffff;--card2:#f2f4f7;--line:#cfd5de;--tx:#12171f;--mut:#4d5967;--dim:#74808f;
--acc:#f2b600;--ink:#171200;--grn:#0a8f5c;--red:#d92d3a;--blu:#0b79b8;--vio:#6a54dd}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.4;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none;touch-action:manipulation;font-size:15px}
button{font-family:inherit;color:inherit}
.num,.big,.kv,.kpi .v,.bn{font-family:var(--fd);font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}.dim{color:var(--dim)}.pad{padding:14px}.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
a{color:var(--acc)}

/* ---------- auth ---------- */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--st)) 16px 20px}
.auth-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.auth-top{position:relative;display:flex;justify-content:center;padding-top:2px}.auth-top #auth-lang{position:absolute;top:0;right:0}
.auth-brand{width:min(280px,72%)}
.og-lock{display:block;width:100%;height:auto}.og-o{fill:var(--tx)}.og-g{fill:var(--acc)}.og-h{fill:var(--mut)}
body.light .og-g{fill:#c98a00}
.road{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--acc) 0 22px,transparent 22px 40px);opacity:.9}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13px;padding:9px 11px;border-radius:10px;display:none}
.msg.err{display:block;color:var(--red);background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3)}
.msg.ok{display:block;color:var(--grn);background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3)}

/* ---------- inputs / buttons ---------- */
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:11px;font-size:16px;font-family:var(--fb);outline:none;min-height:46px;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--acc);flex:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,196,0,.18)}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.grn{background:var(--grn);color:#04150d;border-color:var(--grn)}
.btn.dng{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.4)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.icon-btn{min-width:42px;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700;cursor:pointer}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;max-width:100%}
.seg button{border:0;background:transparent;color:var(--mut);padding:0 14px;min-height:38px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--ink)}
.mset{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:8px}
.mset>div{min-width:0;max-width:100%}
.mlbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 5px 2px}
.mhint{margin:2px 2px 12px;line-height:1.45}
.wstart{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.wstart>label{flex:0 1 auto;max-width:44%;margin:0;font-size:12px;line-height:1.25;color:var(--tx);font-weight:600}
.wstart>label small{display:block;font-size:10.5px;color:var(--dim);font-weight:500}
.wstart input{min-height:40px;padding:7px 10px}
.wstart .pst{font-size:10.5px;color:var(--grn);margin-top:2px}
.wstart .pst:empty{display:none}
.wstart .pst.warn{color:var(--red)}
.atag{display:none;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn);vertical-align:1px;text-transform:uppercase}
.is-auto .atag{display:inline-block}
.is-auto input{border-style:dashed;border-color:color-mix(in srgb,var(--grn) 55%,var(--line));background:color-mix(in srgb,var(--grn) 8%,var(--bg2));cursor:default}
.is-auto input:focus{box-shadow:none;border-color:var(--grn)}
.seg.blu button.on{background:var(--blu);color:#02121b}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + var(--st)) 12px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tag{font-family:var(--fb);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--acc);color:var(--acc)}
.tag.d{border-color:var(--blu);color:var(--blu)}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.sync{font-size:11px;color:var(--dim);white-space:nowrap}
.brand{min-width:0;overflow:hidden}
.og-em{display:block;flex:none;width:auto}.brand .og-em{height:31px}
.bn{display:flex;align-items:baseline;min-width:0;line-height:1}
.bn-o{color:var(--tx)}.bn-g{color:var(--acc)}body.light .bn-g{color:#a87800}
.bn-h{margin-left:6px;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.28em;color:var(--mut)}
@media(max-width:379px){.bn-h{display:none}}
@media(max-width:359px){.brand{font-size:20px}.brand .og-em{height:28px}}
.rp-brand{display:flex;align-items:center;gap:10px}.rp-brand .og-em{height:42px}
.wdates-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#wk-dhint{min-width:0;flex:1 1 200px}#wk-dhint .w{color:var(--acc);font-weight:700}
.ar-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}.ar-dates input,.fgrid input[type=date]{min-width:0;width:100%}
#rp-custom{grid-column:1/-1}.rp-hint{margin-top:10px;line-height:1.4}
.rp-t tfoot td{font-weight:700;border-bottom:none}.rp-t tr.grp td{background:var(--bg2);font-weight:700}
.rp-t td:first-child{white-space:normal;min-width:110px}.rp-t .sm-only{font-weight:500;margin-top:2px}
.rp-xt-t td:first-child{min-width:0;white-space:nowrap}.rp-xt-t td:nth-child(2){white-space:normal}.rp-xt-t tfoot td:first-child{white-space:normal}
@media(max-width:699px){.rp-t .hm{display:none}}@media(min-width:700px){.rp-t .sm-only{display:none}}
.rp-x{margin-top:14px}.rp-x .ct{font-size:17px;margin-bottom:6px}
.pdf-prev{display:block;width:100%;max-height:44dvh;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
a.btn{text-decoration:none;color:inherit}
@media(max-width:420px){.ar-dates{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ar-dates .btn{grid-column:span 2}}
.icon-btn{flex:none}
@media(max-width:560px){.sync{display:none}.top .tag{display:none}.icon-btn{min-width:40px;min-height:40px}}
.shell{display:block}
main{padding:12px 12px calc(88px + var(--sb));max-width:1120px;margin:0 auto;width:100%}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
nav#nav button{border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;cursor:pointer;border-radius:12px;min-height:50px}
nav#nav button .ic{font-size:21px;line-height:1}
nav#nav button.on{color:var(--acc)}
nav#nav button.on .ic{transform:translateY(-1px)}
@media(min-width:980px){
 .shell{display:grid;grid-template-columns:210px 1fr;gap:0;max-width:1360px;margin:0 auto}
 nav#nav{position:sticky;top:64px;align-self:start;height:calc(100vh - 80px);grid-template-columns:1fr;grid-auto-rows:52px;align-content:start;gap:4px;background:transparent;backdrop-filter:none;border:0;padding:16px 10px}
 nav#nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:14px}
 nav#nav button.on{background:var(--card);border:1px solid var(--line)}
 main{padding-bottom:40px}
}
.page{display:none;flex-direction:column;gap:14px}
.page.active{display:flex}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card.flat{background:var(--card2)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ct{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:.3px}
.cs{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fgrid .s2{grid-column:span 2}
.ro-banner{background:rgba(255,196,0,.12);border:1px solid var(--acc);color:var(--acc);padding:9px 12px;border-radius:12px;font-weight:700;font-size:13px;text-align:center}
body.ro .need-write{display:none!important}

/* hero */
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--acc) 0 22px,transparent 22px 40px)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.hl{font-size:12px;font-weight:600;color:var(--mut)}
.big{font-size:clamp(34px,11.5vw,58px);font-weight:800;line-height:1;margin-top:2px;letter-spacing:.5px;white-space:nowrap}
.hero-top>div:first-child{min-width:0}
.big.neg{color:var(--red)}
.delta{font-size:12px;font-weight:700;margin-top:6px}
.delta.up{color:var(--grn)}.delta.dn{color:var(--red)}.delta.zz{color:var(--mut)}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
@media(max-width:420px){.ring{width:74px;height:74px}.ring>div{width:58px!important;height:58px!important}.ring .rv{font-size:19px}.ring .rl{font-size:8px;max-width:52px}}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv{font-family:var(--fd);font-size:22px;font-weight:800;line-height:1}
.ring .rl{font-size:9px;color:var(--mut);text-align:center;line-height:1.1;max-width:60px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media(min-width:640px){.chips{grid-template-columns:repeat(4,1fr)}}
.chip{background:var(--card2);border-radius:12px;padding:9px 11px}
.chip .l{font-size:11px;color:var(--mut)}
.chip .v{font-family:var(--fd);font-size:22px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.kpi .l{font-size:11px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:11px;color:var(--dim)}
.kpi.hl{border-color:var(--acc)}
.g{color:var(--grn)}.r{color:var(--red)}.a{color:var(--acc)}.b{color:var(--blu)}
.ins{display:flex;flex-direction:column;gap:8px}
.ins div{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:9px 12px;font-size:13px}
.ins div.w{border-color:var(--red)}.ins div.o{border-color:var(--grn)}

/* row cards (loads / fuel / expenses) */
.list{display:flex;flex-direction:column;gap:10px}
.rc{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.rc>.f{grid-column:span 6;min-width:0}
.rc>.f.w12{grid-column:span 12}
.rc>.rc-h{grid-column:span 12;display:flex;align-items:center;gap:10px}
.rc .n{font-family:var(--fd);background:var(--acc);color:var(--ink);font-weight:800;border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-size:16px}
.rc .rc-sum{flex:1;font-size:12px;color:var(--mut);font-weight:600}
.rc .x{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,90,95,.4);background:rgba(255,90,95,.1);color:var(--red);font-size:16px;cursor:pointer}
.rc .pst{font-size:11px;color:var(--grn);min-height:15px;margin-top:3px}
.rc .pst.warn{color:var(--red)}
.rc .chk{display:flex;align-items:center;gap:8px;min-height:46px;font-size:13px;color:var(--tx);margin:0;cursor:pointer}
.rc .foot{grid-column:span 12;display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:760px){
 .rc>.f.t2{grid-column:span 2}.rc>.f.t3{grid-column:span 3}.rc>.f.t4{grid-column:span 4}.rc>.f.t6{grid-column:span 6}
}
/* compact inputs inside lists */
.cmp label{font-size:11px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp input,.cmp select{min-height:40px;padding:7px 9px;border-radius:9px}
.cmp input[type=number]{font-family:var(--fd);font-size:17px;font-weight:600}
.cmp input[type=text]{text-overflow:ellipsis}
.cmp input.g{color:var(--grn);font-weight:700}.cmp input.r{color:var(--red)}.cmp input.b{color:var(--blu)}
.x{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,90,95,.35);background:rgba(255,90,95,.08);color:var(--red);font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0}
/* loads: one-line summary, tap to edit */
.ld{background:var(--card2);border:1px solid var(--line);border-radius:12px;min-width:0}
.ld.open{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.ld-h{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;border:0;border-radius:12px;text-align:left;cursor:pointer;min-height:52px;color:var(--tx)}
.ld-h .n{font-family:var(--fd);background:var(--acc);color:var(--ink);font-weight:800;border-radius:7px;min-width:26px;height:26px;display:grid;place-items:center;font-size:15px;flex:none}
.ld-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ld-route{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-route.dim{color:var(--dim);font-weight:600}
.ld-meta{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-gross{flex:none;font-family:var(--fd);font-weight:700;font-size:19px;color:var(--grn)}
.ld-gross.z{color:var(--dim);font-size:16px}
.ld-chev{flex:none;color:var(--dim);font-size:11px;transition:transform .2s}
.ld.open .ld-chev{transform:rotate(180deg)}
.ld-b{display:none;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:0 10px 10px}
.ld.open .ld-b{display:grid}
.ld-b>.f{min-width:0;grid-column:span 3}
.ld-b>.f.cw-num{grid-column:span 2}.ld-b>.f.cw-num.wide{grid-column:span 3}
.ld-b .pst{font-size:10.5px;color:var(--grn);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-b .pst:empty{display:none}.ld-b .pst.warn{color:var(--red)}
.ld-b .chk{display:flex;align-items:center;gap:8px;min-height:40px;font-size:13px;color:var(--tx);margin:0;cursor:pointer;white-space:normal;line-height:1.2}
.ld-b .cw-chk{align-self:end}
.ld-foot{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
/* partials (a second shipment on the same trip): violet so they never look like a separate load */
.pts{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pts-h{display:none;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}.pts.has .pts-h{display:flex}
.pts-t{font-weight:700;font-size:13px;color:var(--vio)}.pts-s{font-size:12px;color:var(--mut)}
.pts-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pts-hint{flex:1 1 180px;line-height:1.35}
.pt{border:1px solid color-mix(in srgb,var(--vio) 32%,var(--line));border-left:3px solid var(--vio);border-radius:10px;padding:8px;background:color-mix(in srgb,var(--vio) 6%,var(--card2));min-width:0}
.pt-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-height:28px}
.pt-n{font-family:var(--fd);font-weight:800;font-size:13px;background:var(--vio);color:#160f2b;border-radius:6px;padding:2px 7px;flex:none}
.pt-out{flex:1;min-width:0;font-size:12px;color:var(--mut);line-height:1.3}.pt-out b{color:var(--grn)}.pt-out b.neg{color:var(--red)}.pt-out .pt-dim{color:var(--dim)}
.pt-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.pt-g>.f{grid-column:span 3;min-width:0}.pt-g>.f.n{grid-column:span 2}
.pt .pst{font-size:10.5px;color:var(--grn);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt .pst:empty{display:none}.pt .pst.warn{color:var(--red)}
.pt .pt-mst{color:var(--vio)}.pt-auto input{border-style:dashed;border-color:color-mix(in srgb,var(--vio) 60%,var(--line))}
.pt .chk{display:flex;align-items:center;gap:8px;min-height:34px;font-size:12.5px;color:var(--tx);margin:4px 0 0;cursor:pointer}
.pt-add{align-self:flex-start;border-color:color-mix(in srgb,var(--vio) 55%,var(--line));color:var(--vio)}
.pt .x{flex:none}
.pt-row td{color:var(--mut);font-size:12px}.pt-row td b{color:var(--vio);font-weight:600}.pt-row td.g{color:var(--grn)}
.sumbar b.v{color:var(--vio)}
@media(min-width:760px){
 .ld-b{grid-template-columns:repeat(12,minmax(0,1fr))}
 .pt-g{grid-template-columns:repeat(12,minmax(0,1fr))}.pt-g>.f{grid-column:span 3}.pt-g>.f.n{grid-column:span 2}
 .ld-b>.f{grid-column:span 3}.ld-b>.f.cw-num{grid-column:span 2}.ld-b>.f.cw-num.wide{grid-column:span 3}
}
/* fuel + expenses: table-like rows that fit the screen */
.tlist{display:flex;flex-direction:column}
.tlist>*{border-bottom:1px solid var(--line)}.tlist>:last-child{border-bottom:0}
.fhead,.frow{display:grid;grid-template-columns:minmax(0,1fr) 60px 68px 52px 32px;gap:5px;align-items:center}
.fhead{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;padding:0 2px 5px;white-space:nowrap}
.fhead span{overflow:hidden;text-overflow:ellipsis}
.frow{padding:6px 0}
.frow input[type=number]{padding:6px 4px;text-align:right;font-size:16px}
.fhead .c-fgal,.frow .c-fgal{display:none}
@media(min-width:600px){.fhead,.frow{grid-template-columns:minmax(0,1fr) 84px 92px 84px 84px 34px;gap:8px}.fhead .c-fgal,.frow .c-fgal{display:block}}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 100px 32px;grid-template-areas:"nm tot x" "ty vl vl";gap:6px 8px;align-items:center;padding:8px 0}
.erow .e-name{grid-area:nm;font-weight:600}.erow .e-type{grid-area:ty}.erow .e-val{grid-area:vl}.erow .x{grid-area:x}
.erow .e-tot{grid-area:tot;font-family:var(--fd);font-size:20px;font-weight:700;text-align:right;white-space:nowrap}
@media(min-width:760px){.erow{grid-template-columns:minmax(0,3fr) minmax(0,2fr) 110px 120px 34px;grid-template-areas:"nm ty vl tot x"}}
/* small one-line cards */
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pctin{display:flex;align-items:center;gap:5px;font-weight:700;color:var(--mut)}
.pctin input{width:66px;min-height:40px;padding:6px 8px;text-align:right;font-family:var(--fd);font-size:18px;font-weight:700}
.tval{text-align:right;min-width:84px}
.tval .v{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1.1}
#card-maint>.ch{margin-bottom:0}#maint-body{margin-top:12px}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 32px;grid-template-areas:"nm am x" "dt . .";gap:6px 8px;align-items:center;padding:8px 0}
.xrow .x-name{grid-area:nm;font-weight:600}.xrow .x-amt{grid-area:am;text-align:right;color:var(--red)}.xrow .x{grid-area:x}.xrow .x-date{grid-area:dt;max-width:190px}
@media(min-width:760px){.xrow{grid-template-columns:minmax(0,1fr) 180px 130px 34px;grid-template-areas:"nm dt am x"}.xrow .x-date{max-width:none}}
#xt-range{margin-bottom:2px}
.xt-res{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.xt-big{font-family:var(--fd);font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap}
.xt-tab{margin-top:8px}.xt-tab td,.xt-tab th{padding:7px 6px}.xt-tab tr:last-child td{border-bottom:0}
.imp-it{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;margin:0;cursor:pointer;color:var(--tx);font-size:14px}
.imp-it input{margin-top:1px}.imp-it.dup{opacity:.55;cursor:default}
@media(max-width:560px){
 main{padding:10px 10px calc(84px + var(--sb))}
 .page{gap:12px}
 .card{padding:12px;border-radius:14px}
 .ct{font-size:18px}
 .ch{margin-bottom:10px}
 input,select{min-height:42px}
 .btn{min-height:42px}.btn.sm{min-height:34px}
 .seg button{min-height:34px;padding:0 11px;font-size:12.5px}
 .mlbl{display:none}
 .mset{gap:8px}
 .kpi{padding:10px 11px}
}
.sumbar{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--mut);background:var(--bg2);border-radius:11px;padding:10px 12px;margin-top:10px}
.sumbar b{color:var(--tx)}
.empty{padding:22px 10px;text-align:center;color:var(--dim);font-size:13px}

/* tables (read-only) */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;font-size:11px;color:var(--mut);padding:8px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);font-size:13px}
.ar{text-align:right}

/* charts */
.cw{position:relative;height:240px;width:100%}
.cbox{background:var(--card2);border-radius:14px;padding:12px;min-width:0;overflow:hidden}
.cbt{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--grn));border-radius:6px;transition:width .4s}
.anat{display:flex;height:28px;border-radius:9px;overflow:hidden;background:var(--line);margin:10px 0}
.anat i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:#000;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.legend span.d{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.pill{display:inline-flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700}
.verdict{padding:14px;border-radius:12px;font-weight:800;text-align:center;border:2px solid;font-size:15px;margin:10px 0}
.verdict.g{background:rgba(61,220,151,.12);border-color:var(--grn);color:var(--grn)}
.verdict.y{background:rgba(255,196,0,.12);border-color:var(--acc);color:var(--acc)}
.verdict.r{background:rgba(255,90,95,.12);border-color:var(--red);color:var(--red)}
.scan{border:1px dashed var(--blu);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.scan-st{font-size:12px;font-weight:700;color:var(--acc);padding:8px 10px;border-radius:9px;background:rgba(255,196,0,.1);display:none}
.scan-st.err{color:var(--red);background:rgba(255,90,95,.1)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
details summary{cursor:pointer;font-size:13px;color:var(--mut);min-height:36px;display:flex;align-items:center}

/* map */
.map-wrap svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--bg2)}
.map-wrap .st{fill:var(--card2);stroke:var(--line);stroke-width:.8}
.map-wrap .st.x{fill:color-mix(in srgb,var(--acc) 16%,var(--card2))}
.map-wrap .st.s{fill:color-mix(in srgb,var(--acc) 38%,var(--card2))}
.seg-ld{fill:none;stroke:var(--grn);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease forwards;animation-delay:var(--d)}
.seg-dh{fill:none;stroke:var(--red);stroke-width:3.5;stroke-dasharray:10 8;opacity:0;animation:fade .5s ease forwards;animation-delay:var(--d)}
.mk{opacity:0;animation:fade .4s ease forwards;animation-delay:var(--d)}
.mk circle{fill:var(--acc);stroke:var(--bg);stroke-width:3}
.mk .mn{fill:var(--ink);font:800 19px var(--fd);text-anchor:middle}
.mk .ml{fill:var(--tx);font:700 25px var(--fb);paint-order:stroke;stroke:var(--bg2);stroke-width:7px;stroke-linejoin:round}
/* period map (Summary): heat by stops, merged lanes */
.map-wrap .st.h1{fill:color-mix(in srgb,var(--acc) 20%,var(--card2))}
.map-wrap .st.h2{fill:color-mix(in srgb,var(--acc) 34%,var(--card2))}
.map-wrap .st.h3{fill:color-mix(in srgb,var(--acc) 50%,var(--card2))}
.lane-ld{fill:none;stroke:var(--grn);stroke-linecap:round;opacity:.85;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards;animation-delay:var(--d)}
.lane-dh{fill:none;stroke:var(--red);stroke-linecap:round;stroke-dasharray:8 7;opacity:0;animation:fade .5s ease forwards;animation-delay:var(--d)}
.mk2{opacity:0;animation:fade .4s ease forwards;animation-delay:var(--d)}
.mk2 circle{fill:var(--acc);stroke:var(--bg);stroke-width:2.5}
.mk2 .ml{fill:var(--tx);font:700 23px var(--fb);paint-order:stroke;stroke:var(--bg2);stroke-width:7px;stroke-linejoin:round}
.tl-row{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}.tl-row .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:reduce){.lane-ld{stroke-dashoffset:0;animation:none}.lane-dh,.mk2{opacity:1;animation:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.seg-ld{stroke-dashoffset:0;animation:none}.seg-dh,.mk{opacity:1;animation:none}}

/* sheet / toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 16px calc(16px + var(--sb));display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));z-index:80;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
@media(min-width:980px){#toast{bottom:30px}}

@media print{
 body{background:#fff!important;color:#000!important}
 .top,nav#nav,.no-print,.page:not(#page-reports){display:none!important}
 #page-reports{display:flex!important}
 .rp-detail{display:block!important}
 .card,.kpi,.chip{background:#fff!important;border:1px solid #bbb!important;color:#000!important}
 *{color:#000!important}
 main{padding:0}
}
</style>

var $=function(s,p){return(p||document).querySelector(s);};
var $$=function(s,p){return Array.prototype.slice.call((p||document).querySelectorAll(s));};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n;}
function f0(v){return Math.round(num(v)).toLocaleString('en-US');}
function f1(v){return num(v).toFixed(1);}
function f2(v){return num(v).toFixed(2);}
function money(v,d){d=d==null?2:d;var n=num(v);return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);}
function isoOf(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function todayISO(){return isoOf(new Date());}
function addDaysISO(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
function isISO(s){return/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function mondayOf(iso){var d=new Date(iso+'T00:00:00');return addDaysISO(iso,-((d.getDay()+6)%7));}
var DOW={ru:['вс','пн','вт','ср','чт','пт','сб'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
function dowOf(iso){return(DOW[LANG]||DOW.en)[new Date(iso+'T00:00:00').getDay()];}
function cssv(n){return getComputedStyle(document.body).getPropertyValue(n).trim()||'#888';}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function toast(msg,ms){var el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){el.style.display='none';},ms||2400);}
function stateCodes(text){var u=String(text||'').toUpperCase();var m=u.match(/\b[A-Z]{2}\b/g)||[];return m.filter(function(x){return STATE_NAMES[x];});}
function loadDays(l){if(!l.pickup||!l.delivery)return 0;var a=new Date(l.pickup+'T00:00:00'),b=new Date(l.delivery+'T00:00:00');if(isNaN(a)||isNaN(b)||b<a)return 0;return Math.round((b-a)/864e5)+1;}
function daysUnion(loads){var set={};(loads||[]).forEach(function(l){if(!l.pickup||!l.delivery)return;var a=new Date(l.pickup+'T00:00:00'),b=new Date(l.delivery+'T00:00:00');if(isNaN(a)||isNaN(b)||b<a)return;var n=0;while(a<=b&&n<62){set[isoOf(a)]=1;a.setDate(a.getDate()+1);n++;}});return Object.keys(set).length;}
function monthOf(w){var e=w.endDate||w.weekEndDate||'';if(/^\d{4}-\d{2}/.test(e))return e.slice(0,7);var s=w.startDate||'';if(/^\d{4}-\d{2}-\d{2}/.test(s)){var d=new Date(s+'T00:00:00');var dow=d.getDay()||7;d.setDate(d.getDate()+(4-dow));return isoOf(d).slice(0,7);}return w.monthYear||todayISO().slice(0,7);}
function isMaintItem(name,type){var n=String(name||'').toLowerCase();return type==='cpm'||type==='dlr_mile'||/(^|[^а-яa-z])то([^а-яa-z]|$)/i.test(n)||/maint|ремонт|oil|масл|аморт|reserve|резерв|tire|шин/.test(n);}
function hav(a,b){var R=3958.8,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(x));}

function ptList(l){return l&&Array.isArray(l.partials)?l.partials:[];}
function ptSum(l){var o={n:0,pay:0,mi:0,unp:0,unpN:0};ptList(l).forEach(function(q){var pay=num(q.pay),mi=num(q.miles);if(pay>0||mi>0||String(q.fromText||'').trim()||String(q.toText||'').trim())o.n++;o.pay+=pay;o.mi+=mi;if(q.unpaid&&pay>0){o.unp+=pay;o.unpN++;}});return o;}
function ptOut(q){return{fromText:q.fromText||'',toText:q.toText||'',fromGeo:q.fromGeo||null,toGeo:q.toGeo||null,miles:num(q.miles),pay:num(q.pay),broker:q.broker||'',unpaid:!!q.unpaid,mAuto:!!q.mAuto};}
function ptRoute(q){return[String(q.fromText||'').trim(),String(q.toText||'').trim()].filter(Boolean).join(' → ');}

function parseCityState(raw){
 var s=raw.replace(/\s+/g,' ').trim(),st='',city='';
 var parts=s.split(',').map(function(x){return x.trim();}).filter(Boolean);
 if(parts.length>=2){st=stFrom(parts[parts.length-1].replace(/\s*\d{5}(-\d{4})?$/,''));city=st?parts.slice(0,-1).join(' '):parts[0];}

/* =========================================================
   Place inputs (load rows + evaluator)
   ========================================================= */
function setPst(el,text,warn){if(!el)return;el.textContent=text||'';el.classList.toggle('warn',!!warn);}
async function resolveInto(inp,obj,tk,gk,done){
 var txt=inp.value.trim();obj[tk]=txt;
 var st=inp.parentElement.querySelector('.pst');
 if(!txt){obj[gk]=null;setPst(st,'');done&&done();return;}
 if(obj[gk]&&obj[gk].label===txt){return;}
 setPst(st,'…');
 var g=await resolvePlace(txt);
 if(inp.value.trim()!==txt)return;
 if(g){obj[gk]=g;obj[tk]=g.label;inp.value=g.label;setPst(st,pstText(g));}
 else{obj[gk]=null;setPst(st,'⚠ '+t('geo.nf'),true);}
 done&&done();
}
/* ---- Miles: 'auto' (from addresses, fields locked) or 'manual' (never touched) ----
   loaded   = From -> To of the load
   deadhead = previous load's To -> this load's From (1st load: week start -> From)
   In "total miles" mode an auto load gets loaded + deadhead in one number. */
function prevGeo(i){return i===0?(S.startGeo||null):((S.loads[i-1]||{}).toGeo||null);}
function canLd(l){return!!(l&&l.fromGeo&&l.toGeo);}
function canDh(i){var l=S.loads[i];return!!(l&&l.fromGeo&&prevGeo(i));}
function setAutoField(inp,on,val){
 if(!inp)return;
 inp.parentElement.classList.toggle('is-auto',!!on);inp.readOnly=!!on;
 if(val!==undefined&&(on||document.activeElement!==inp))inp.value=num(val);
}
function syncMilesUI(l){
 var c=$('[data-list="loads"][data-id="'+l.id+'"]');if(!c)return;
 var i=S.loads.indexOf(l),auto=S.milesCalc==='auto';
 setAutoField(c.querySelector('[data-k="miles"]'),auto&&canLd(l),l.miles);
 setAutoField(c.querySelector('[data-k="deadhead"]'),auto&&canDh(i),l.deadhead);
 updateLoadOut(l);
}
async function ensureGeo(l,side){
 if(l[side+'Geo'])return l[side+'Geo'];
 var txt=String(l[side+'Text']||'').trim();if(!txt)return null;
 var g=await resolvePlace(txt);
 if(!g||l[side+'Geo']||String(l[side+'Text']||'').trim()!==txt)return l[side+'Geo']||null;
 l[side+'Geo']=g;l[side+'Text']=g.label;l.route=[l.fromText,l.toText].filter(Boolean).join(' -> ');
 var c=$('[data-list="loads"][data-id="'+l.id+'"]'),inp=c&&c.querySelector('[data-place="'+side+'"]');
 if(inp&&document.activeElement!==inp){inp.value=g.label;setPst(inp.parentElement.querySelector('.pst'),pstText(g));}
 return g;
}
/* force: the user tapped the button (works in manual mode too, retries OSRM) */
async function calcLoadMiles(l,force){
 if(S.milesCalc!=='auto'&&!force)return;
 var tok=l._tok=(l._tok||0)+1;
 var i=S.loads.indexOf(l);if(i<0)return;
 var p=prevGeo(i),ld=null,dh=null,apx=false,r;
 if(l.fromGeo&&l.toGeo){r=await roadInfo(l.fromGeo,l.toGeo,force);ld=r.mi;apx=r.approx;}
 if(p&&l.fromGeo){if(hav(p,l.fromGeo)<8)dh=0;else{r=await roadInfo(p,l.fromGeo,force);dh=r.mi;apx=apx||r.approx;}}
 if(l._tok!==tok||S.loads.indexOf(l)<0)return;
 if(S.milesCalc!=='auto'&&!force)return;
 if(S.milesMode==='split'){if(ld!=null)l.miles=ld;if(dh!=null)l.deadhead=dh;}
 else if(ld!=null){l.miles=ld+(dh||0);l.deadhead=0;}
 l.apx=(ld!=null||dh!=null)&&apx;
 syncMilesUI(l);
}
async function calcAllMiles(resolve){
 if(resolve&&S.startText&&!S.startGeo){var sg=await resolvePlace(S.startText);if(sg&&!S.startGeo){S.startGeo=sg;S.startText=sg.label;}}
 var list=S.loads.slice();
 for(var i=0;i<list.length;i++){
  if(resolve){await ensureGeo(list[i],'from');await ensureGeo(list[i],'to');}
  await calcLoadMiles(list[i]);
  await recalcPartials(list[i]);
 }
 S.loads.forEach(syncMilesUI);refresh();
}
/* auto mode: a partial picked up and dropped on the way A → P1 → P2 → B adds d(A,P1)+d(P1,P2)+d(P2,B)−d(A,B).
   Only fills miles the user has not typed (empty, or filled by us before); typed miles are never touched. */
async function calcPartialMiles(l,q,force){
 if(S.milesCalc!=='auto'||!(q.mAuto||!num(q.miles))||!(l.fromGeo&&l.toGeo&&q.fromGeo&&q.toGeo))return;
 var tok=q._tok=(q._tok||0)+1;
 var rd=async function(a,b){return hav(a,b)<8?0:(await roadInfo(a,b,force)).mi;};
 var ab=await rd(l.fromGeo,l.toGeo),a1=await rd(l.fromGeo,q.fromGeo),x=await rd(q.fromGeo,q.toGeo),b2=await rd(q.toGeo,l.toGeo);

function parseSingleRelay(raw){
 if(!raw)return null;
 var lines=raw.split(/\r?\n/).map(function(l){return l.replace(/\|/g,' ').replace(/\s+/g,' ').trim();}).filter(Boolean);
 var dG=0,dC=0,fG=0,fC=0,loc='',li=-1,i;
 for(i=0;i<lines.length;i++){if(/\bLocation\b/i.test(lines[i])){li=i;break;}}
 for(var j=(li!==-1?li:0);j<lines.length;j++){
  var ln=lines[j];if(li===-1&&/PALOS\s+PARK/i.test(ln))continue;
  var zm=ln.match(/([A-Za-z\.\-\s]{2,35}?)[,\s]+([A-Z]{2})\s+\d{5}\b/);
  if(zm){var c=zm[1].replace(/^(Location|Pilot|Flying\s*J|Loves|TA|Petro)\s*/i,'').trim(),s=zm[2].toUpperCase();if(STATE_NAMES[s]&&c.length>=2){loc=c+', '+s;break;}}
 }
 if(!loc&&li!==-1){
  for(var k=li;k<Math.min(lines.length,li+5)&&!loc;k++){var w=lines[k].split(' ');
   for(var x=w.length-1;x>=0;x--){var cs=w[x].replace(/[^A-Za-z]/g,'').toUpperCase();
    if(cs.length===2&&STATE_NAMES[cs]){var cp=[];for(var c2=0;c2<x;c2++){if(!/^\d+$/.test(w[c2])&&!/^(Location|Code)$/i.test(w[c2]))cp.push(w[c2]);}loc=(cp.length?cp.join(' ')+', ':'')+cs;break;}}}
 }
 function row(rx,after){
  for(var m=0;m<lines.length;m++){var r=lines[m];
   if(rx.test(r)||(after.test(r)&&/\/gal/i.test(r))){
    var rest=r.replace(after,'').trim();
    var clean=rest.replace(/\$?\d+[\.,]\d+\s*\/\s*gal/gi,' ');
    var nums=clean.match(/\d+[\.,]\d+/g)||[];
    if(nums.length<2)nums=rest.match(/\d+[\.,]\d+/g)||[];
    if(nums.length>=2)return[parseFloat(nums[0].replace(',','.'))||0,parseFloat(nums[nums.length-1].replace(',','.'))||0];
   }}

 }
 var d=row(/^\s*(?:Diesel|ULSD|Clear\s*Diesel)\b/i,/^.*?\b(?:Diesel|ULSD)\b/i);if(d){dG=d[0];dC=d[1];}
 var f=row(/^\s*Def\b/i,/^.*?\bDef\b/i);if(f){fG=f[0];fC=f[1];}
 if(dG>0||dC>0||fG>0||fC>0)return{loc:loc||'Relay Stop',dieselGal:+dG.toFixed(3),dieselCost:+dC.toFixed(2),defGal:+fG.toFixed(3),defCost:+fC.toFixed(2)};

}
function parseRelayTable(raw){

  var line=lines[i].replace(/\|/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;
  if(/^(Grand Total|Qty\s+Total|DEF\s+\d|Diesel\s+\d|Item\s+Gallons)/i.test(line)&&!/\b\d{2}\/\d{2}\/\d{4}\b/.test(line))continue;
  var pm=line.match(/\b(Diesel|DEF|ULSD|BIO|CLEAR DIESEL)\b/i);if(!pm)continue;
  var isDef=pm[1].toUpperCase()==='DEF',before=line.slice(0,pm.index).trim(),after=line.slice(pm.index+pm[0].length).trim();
  var st='US',city='Fuel Stop',tb=before.split(' ');
  for(var t0=tb.length-1;t0>=0;t0--){var ct=tb[t0].replace(/[^A-Za-z]/g,'').toUpperCase();
   if(ct.length===2&&STATE_NAMES[ct]){st=ct;var cw=[];for(var c=t0-1;c>=Math.max(0,t0-3);c--){var w=tb[c];if(!w||w.indexOf(')')!==-1||w.indexOf('#')!==-1||/\d/.test(w)||/^(Pilot|FlyingJ|Loves|TA|Petro|Sapp)$/i.test(w))break;cw.unshift(w.replace(/[^A-Za-z\.\-]/g,''));}if(cw.length)city=cw.join(' ');break;}}

  for(var n=0;n<ca.length;n++){var isd=ca[n].indexOf('$')!==-1,cn=parseFloat(ca[n].replace(/[^0-9\.]/g,''));if(!isNaN(cn)&&cn>=0){all.push(cn);if(isd)dol.push(cn);}}

/* =========================================================
   US route map
   ========================================================= */
var TOPO=null,D3P=null;
var D3_SRC=['https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js','https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js'];
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=false;s.onload=function(){res();};s.onerror=function(){s.remove();rej(new Error('load '+src));};document.head.appendChild(s);});}
function d3Ready(){return!!(window.d3&&typeof d3.geoAlbersUsa==='function'&&typeof d3.geoPath==='function'&&typeof d3.geoContains==='function'&&typeof d3.geoInterpolate==='function');}
/* d3-geo calls into d3-array while it loads, so d3-array MUST be loaded first.
   (6.0/6.1 loaded them in the wrong order and the map hung on "Drawing the map…") */
function ensureD3(){
 if(d3Ready())return Promise.resolve();
 if(!D3P)D3P=loadScript(D3_SRC[0]).then(function(){return loadScript(D3_SRC[1]);}).then(function(){if(!d3Ready())throw new Error('d3-geo not ready');}).catch(function(e){D3P=null;throw e;});
 return D3P;
}
function getTopo(){
 if(TOPO)return TOPO;
 TOPO=fetchJson('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json',15000).catch(function(e){TOPO=null;throw e;});
 return TOPO;
}
/* Minimal TopoJSON -> GeoJSON (same result as topojson-client's feature(), no extra library) */
function topoFeature(topo,obj){
 var tf=topo.transform,arcs=topo.arcs,cache={};
 function arc(i){var k=i<0?~i:i,pts=cache[k];
  if(!pts){var a=arcs[k],x=0,y=0;pts=new Array(a.length);
   for(var j=0;j<a.length;j++){if(tf){x+=a[j][0];y+=a[j][1];pts[j]=[x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]];}else pts[j]=[a[j][0],a[j][1]];}
   cache[k]=pts;}
  return i<0?pts.slice().reverse():pts;}
 function ring(ids){var out=[];for(var n=0;n<ids.length;n++){var p=arc(ids[n]);if(out.length)out.pop();for(var m=0;m<p.length;m++)out.push(p[m]);}while(out.length&&out.length<4)out.push(out[0]);return out;}
 function geom(g){if(!g)return null;
  if(g.type==='Polygon')return{type:'Polygon',coordinates:g.arcs.map(ring)};
  if(g.type==='MultiPolygon')return{type:'MultiPolygon',coordinates:g.arcs.map(function(p){return p.map(ring);})};
  if(g.type==='GeometryCollection')return{type:'GeometryCollection',geometries:g.geometries.map(geom)};
  return null;}
 var list=obj.type==='GeometryCollection'?obj.geometries:[obj];
 return{type:'FeatureCollection',features:list.map(function(g){return{type:'Feature',id:g.id,properties:g.properties||{},geometry:geom(g)};}).filter(function(f){return f.geometry;})};
}
/* "Dallas, TX -> Atlanta, GA", "A → B", "A - B", "A to B", old "MI-NH" */
function routeParts(r){
 r=String(r||'').trim();if(!r)return['',''];
 var m=r.split(/\s*(?:->|→|=>|—|–|\s-\s|\bto\b)\s*/i).filter(Boolean);
 if(m.length>=2)return[m[0].trim(),m[m.length-1].trim()];
 var s=r.match(/^([A-Za-z]{2})\s*-\s*([A-Za-z]{2})$/);
 if(s)return[s[1].toUpperCase(),s[2].toUpperCase()];
 return[r,''];
}
function loadSide(l,side){var p=routeParts(l.route),v=side==='from'?(l.fromText||p[0]):(l.toText||p[1]);return String(v||'').trim();}
async function geoOfLoad(l,side){var g=l[side+'Geo'];if(g&&g.lat!=null)return g;var txt=loadSide(l,side);if(!txt)return null;return await resolvePlace(txt);}
function arcPath(p,q,k){var mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,off=Math.min(70,len*0.18)*k;return'M'+p[0].toFixed(1)+','+p[1].toFixed(1)+' Q'+(mx-dy/len*off).toFixed(1)+','+(my+dx/len*off).toFixed(1)+' '+q[0].toFixed(1)+','+q[1].toFixed(1);}
async function renderMap(w){
 var box=$('#map-box'),info=$('#map-info'),token=++mapToken;
 box.innerHTML='<div class="muted pad">'+t('map.loading')+'</div>';info.innerHTML='';
 try{await drawMap(w,box,info,token);}
 catch(e){
  if(window.console)console.warn('map:',e);
  if(token===mapToken){box.innerHTML='<div class="muted pad">'+t('map.fail')+' <button type="button" class="btn sm" data-act="mapRetry">↻ '+t('map.retry')+'</button></div>';}
 }

async function drawMap(w,box,info,token){
 /* libraries + state outlines load while places are being looked up */
 var libs=withTimeout(Promise.all([ensureD3(),getTopo()]),25000);libs.catch(function(){});
 var loads=(Array.isArray(w.loads)?w.loads:[]).slice().sort(function(a,b){return String(a.pickup||'').localeCompare(String(b.pickup||''));});
 var segs=[],stops=[],last=null,missing=0;
 var st0=(w.startGeo&&w.startGeo.lat!=null&&w.startGeo.lon!=null)?w.startGeo:null;
 function addStop(g){var s=stops[stops.length-1];if(!s||hav(s.g,g)>5)stops.push({g:g});}
 for(var i=0;i<loads.length;i++){
  var l=loads[i],A=await geoOfLoad(l,'from'),B=await geoOfLoad(l,'to');
  if(token!==mapToken)return;
  if(!A||!B){if(!A&&loadSide(l,'from'))missing++;if(!B&&loadSide(l,'to'))missing++;continue;}
  if(!last&&st0&&hav(st0,A)>25){addStop(st0);segs.push({t:'dh',a:st0,b:A});}
  else if(last&&hav(last,A)>25)segs.push({t:'dh',a:last,b:A});

function weekExpItems(w){

 if(!isD){
  var fuel=num(w.fuelCost),dz=0,df=0;(w.fuelLogs||[]).forEach(function(f){dz+=num(f.dieselCost);df+=num(f.defCost);});
  if(fuel>0){
   if(w.fuelMode!=='mpg'&&dz+df>0&&Math.abs(dz+df-fuel)<0.5){if(dz>0)out.push({key:'~diesel',name:t('rp.diesel'),type:'',sum:dz});if(df>0)out.push({key:'~def',name:'DEF',type:'',sum:df});}
   else out.push({key:'~fuel',name:t('ar.fuelItem'),type:w.fuelMode==='mpg'?t('rp.byMpg'):'',sum:fuel});
  }
 }
 if(Array.isArray(w.expensesList)&&w.expensesList.length){
  w.expensesList.forEach(function(e,i){var v=num(e.val),s=num(e.calculatedSum);if(!s)s=e.type==='fixed'?v:e.type==='percent'?gross*v/100:e.type==='cpm'?mi*v/100:mi*v;
   if(s>0){var nm=String(e.name||'').trim()||('#'+(i+1));out.push({key:nm.toLowerCase()+'|'+(e.type||''),name:nm,type:expTypeLabel(e.type,v),sum:s});}});
 }else{
  [['ar.fixed',w.fixedExpenses,'fixed'],['ar.percent',w.percentExpenses,'percent'],['ar.permile',w.cpmExpenses,'cpm']].forEach(function(a){if(num(a[1])>0)out.push({key:'~'+a[2],name:t(a[0]),type:'',sum:num(a[1])});});
 }
 return out;
}

function pdfWanted(){try{return navigator.standalone===true||/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent||'')||matchMedia('(display-mode: standalone)').matches||matchMedia('(pointer: coarse)').matches;}catch(e){return false;}}
var PDF={blob:null,url:'',name:''};
function pdfFile(){return new File([PDF.blob],PDF.name,{type:'application/pdf'});}
function canShareFile(){try{return!!(PDF.blob&&navigator.share&&navigator.canShare&&navigator.canShare({files:[pdfFile()]}));}catch(e){return false;}}
function pdfSheet(ready,info){
 $('#pdf-bg').hidden=false;$('#pdf-ttl').textContent=t(ready?'pdf.ready':'pdf.making');$('#pdf-info').textContent=info||'';
 $('#pdf-share').hidden=!(ready&&canShareFile());$('#pdf-dl').hidden=!ready;$('#pdf-open').hidden=!ready;$('#pdf-prev').hidden=!ready;$('#pdf-hint').textContent=ready?t('pdf.hint'):'';
}
async function pdfReport(){
 pdfSheet(false);
 try{
  var out=await buildReportPdf();
  if(PDF.url)URL.revokeObjectURL(PDF.url);
  PDF.blob=out.blob;PDF.name='ownergladiator-report-'+todayISO()+'.pdf';PDF.url=URL.createObjectURL(out.blob);
  var dl=$('#pdf-dl');dl.href=PDF.url;dl.setAttribute('download',PDF.name);dl.textContent=t('pdf.dl');
  var op=$('#pdf-open');op.href=PDF.url;op.textContent=t('pdf.open');
  $('#pdf-share').textContent=t('pdf.share');$('#pdf-prev').src=out.preview;
  pdfSheet(true,t('pdf.pages',{n:out.pages,kb:Math.max(1,Math.round(out.blob.size/1024))}));
 }catch(e){$('#pdf-bg').hidden=true;toast(t('pdf.fail',{e:(e&&e.message)||e}),4000);}
}
function makePdf(jpgs,pw,ph,iw,ih){
 var enc=new TextEncoder(),parts=[],off=0,offs=[];
 function add(x){var u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length;}
 function obj(n,chunks){offs[n]=off;add(n+' 0 obj\n');chunks.forEach(add);add('\nendobj\n');}
 add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));
 var n=jpgs.length,info=3+n*3,kids=[],W=pw.toFixed(2),H=ph.toFixed(2);
 for(var i=0;i<n;i++)kids.push((3+i*3)+' 0 R');

/* =========================================================
   Auth
   ========================================================= */
function authMsg(kind,msg){var er=$('#auth-err'),ok=$('#auth-info');er.className='msg';ok.className='msg';er.textContent='';ok.textContent='';if(kind==='err'){er.textContent=msg;er.className='msg err';}else if(kind==='ok'){ok.textContent=msg;ok.className='msg ok';}}
function noSb(){authMsg('err',t(CFG_OK?'auth.nosdk':'auth.cfg'));}
function siteUrl(){return location.href.split('#')[0].split('?')[0];}
async function authLogin(){
 if(!sb)return noSb();
 var e=$('#auth-email').value.trim(),p=$('#auth-pass').value;if(!e||!p)return authMsg('err',t('auth.need'));
 var r=await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error)authMsg('err',r.error.message);else handleSession(r.data.session);
}
async function authSignup(){
 if(!sb)return noSb();
 var e=$('#auth-email').value.trim(),p=$('#auth-pass').value;if(!e||!p)return authMsg('err',t('auth.need'));
 var opts=/^https?:/.test(location.protocol)?{emailRedirectTo:siteUrl()}:undefined;
 var r=await sb.auth.signUp({email:e,password:p,options:opts});
 if(r.error)authMsg('err',r.error.message);else authMsg('ok',t('auth.signed'));
}
async function askNewPass(){
 var p=prompt(t('auth.newPass'));if(p==null)return;
 if(p.length<6){toast(t('auth.short'),3000);return askNewPass();}
 var r=await sb.auth.updateUser({password:p});
 toast(r.error?t('t.err',{e:r.error.message}):t('auth.passOk'),4000);
}
async function authForgot(){
 if(!sb)return noSb();
 var e=$('#auth-email').value.trim();if(!e)return authMsg('err',t('auth.needEmail'));
 var r=await sb.auth.resetPasswordForEmail(e,{redirectTo:siteUrl()});
 if(r.error)authMsg('err',r.error.message);else authMsg('ok',t('auth.reset'));
}
async function handleSession(session){
 if(session&&session.user){
  S.user=session.user;S.viewId=session.user.id;S.ro=false;
  $('#auth').hidden=true;$('#app').hidden=false;
  var admin=session.user.email&&session.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
  $('#admin-wrap').hidden=!admin;if(admin)loadAdminUsers();
  await openProfile();
 }else{S.user=null;S.viewId=null;$('#app').hidden=true;$('#auth').hidden=false;}
}
async function openProfile(){
 S.template=null;S.archive=[];S.archSel=null;S.extras=[];S.milesMode='split';S.milesCalc='auto';loadTemplate();resetWeek();
 var local=null;try{local=JSON.parse(SafeStorage.get(draftKey())||'null');}catch(e){}
 if(!S.ro&&local)applyDraft(local);
 renderStatic();
 if(sb){
  try{var r=await sb.from('user_drafts').select('draft_json,updated_at').eq('user_id',activeId()).maybeSingle();
   if(r.data&&r.data.draft_json){var cloudT=new Date(r.data.updated_at||0).getTime(),localT=local?num(local.updatedAt):0;if(S.ro||cloudT>=localT||!local){applyDraft(r.data.draft_json);if(!S.ro)SafeStorage.set(draftKey(),JSON.stringify(r.data.draft_json));}}}catch(e){}
  renderStatic();await loadArchive();
 }
}
async function loadAdminUsers(){
 try{var r=await sb.rpc('get_all_users_for_admin');if(r.error||!r.data)return;var sel=$('#admin-select');
  sel.innerHTML=r.data.map(function(u){var me=S.user&&u.id===S.user.id;return'<option value="'+esc(u.id)+'">'+(me?'⭐ ':'👤 ')+esc(u.email)+'</option>';}).join('');if(S.user)sel.value=S.user.id;}catch(e){}
}
async function switchAdmin(uidv){
 if(!S.user)return;S.viewId=uidv||S.user.id;S.ro=S.viewId!==S.user.id;$('#menu-bg').hidden=true;
 await openProfile();go('week');
}

function rerender(){
 applyI18n();

  if(!S.exps.length)S.exps=defaultExps(S.role);
  renderStatic();fillArchiveControls();go(curPage);

function init(){

 else{
  sb.auth.getSession().then(function(r){handleSession(r.data&&r.data.session);});
  sb.auth.onAuthStateChange(function(ev,s){
   if(ev==='PASSWORD_RECOVERY')setTimeout(askNewPass,600);
   if(!s&&S.user)handleSession(null);
   else if(s&&s.user&&(!S.user||S.user.id!==s.user.id))handleSession(s);
